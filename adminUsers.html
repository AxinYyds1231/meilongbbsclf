<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .table-wrapper {
            overflow-x: auto;
            max-height: 450px;
            overflow-y: auto;
            border-radius: 12px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(4px);
            padding: 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        th {
            background: rgba(26,60,110,0.1);
            padding: 8px 10px;
            text-align: left;
            font-weight: 600;
            position: sticky;
            top: 0;
            backdrop-filter: blur(4px);
        }
        td {
            padding: 8px 10px;
            border-bottom: 1px solid rgba(0,0,0,0.04);
        }
        .btn-sm {
            padding: 2px 10px;
            font-size: 0.75rem;
            margin: 2px;
        }
        .btn-ban {
            background: rgba(217,83,79,0.1);
            color: #d9534f;
            border: 1px solid rgba(217,83,79,0.15);
        }
        .btn-ban:hover {
            background: #d9534f;
            color: #fff;
        }
        .btn-unban {
            background: rgba(92,184,92,0.1);
            color: #5cb85c;
            border: 1px solid rgba(92,184,92,0.15);
        }
        .btn-unban:hover {
            background: #5cb85c;
            color: #fff;
        }
        .btn-msg {
            background: rgba(26,60,110,0.1);
            color: #1a3c6e;
            border: 1px solid rgba(26,60,110,0.15);
        }
        .btn-msg:hover {
            background: #1a3c6e;
            color: #fff;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .modal-content {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(20px);
            padding: 24px;
            border-radius: 24px;
            max-width: 420px;
            width: 90%;
        }
        .modal-content textarea {
            width: 100%;
            height: 80px;
            padding: 8px;
            border-radius: 12px;
            border: 1px solid rgba(0,0,0,0.06);
            background: rgba(255,255,255,0.5);
            resize: vertical;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }
        .modal-actions button { flex: 1; }
        .admin-menu a.active { background: rgba(26,60,110,0.1); color: #1a3c6e; font-weight:500; }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header"><h2>🔧 管理</h2></div>
            <nav class="sidebar-nav admin-menu">
                <a href="/adminDashboard.html">📊 仪表盘</a>
                <a href="/adminUsers.html" class="active">👥 用户管理</a>
                <a href="/adminPosts.html">📝 帖子管理</a>
                <a href="/adminCategories.html">📂 分类管理</a>
                <a href="/adminStats.html">📊 统计面板</a>
                <a href="/adminSensitive.html">🛡️ 敏感词</a>
                <a href="/adminAnnouncement.html">📢 公告</a>
            </nav>
            <div style="padding:16px; margin-top:auto; border-top:1px solid rgba(0,0,0,0.04);">
                <button onclick="logoutAdmin()" class="btn-secondary btn-sm" style="width:100%;">🚪 退出管理</button>
            </div>
        </aside>

        <main class="main-content">
            <h1 class="page-title">👥 用户管理</h1>
            <div id="error" class="error" style="display:none;"></div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>UID</th>
                            <th>姓名</th>
                            <th>性别</th>
                            <th>年级</th>
                            <th>班级</th>
                            <th>头像状态</th>
                            <th style="text-align:center;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="userList">
                        <tr><td colspan="7" style="text-align:center; padding:20px; color:#8b9aab;">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
            <a href="/adminDashboard.html" style="display:inline-block; margin-top:16px; color:#1a3c6e;">← 返回管理后台</a>
        </main>
    </div>

    <!-- 发送消息模态框 -->
    <div id="msgModal" class="modal">
        <div class="modal-content">
            <h3>📨 发送私信</h3>
            <p style="font-size:0.9rem; color:#6b7a8a;">发送给 <strong id="msgToUidLabel"></strong></p>
            <input type="hidden" id="msgToUid">
            <textarea id="msgContent" placeholder="输入消息内容..."></textarea>
            <div class="modal-actions">
                <button id="sendMsgBtn" class="btn-primary">发送</button>
                <button onclick="closeMsgModal()" class="btn-secondary">取消</button>
            </div>
        </div>
    </div>

    <script>
        let currentUserList = [];

        // 退出管理
        function logoutAdmin() {
            document.cookie = 'adminSession=; Path=/; Max-Age=0';
            window.location.href = '/adminLogin.html';
        }

        // 加载用户列表
        async function loadUsers() {
            try {
                const res = await fetch('/api/adminDashboard', { credentials: 'include' });
                if (res.status === 401 || res.status === 403) {
                    window.location.href = '/adminLogin.html';
                    return;
                }
                const data = await res.json();
                currentUserList = data.users || [];
                renderTable(currentUserList);
            } catch (err) {
                document.getElementById('error').textContent = '加载失败，请刷新重试';
                document.getElementById('error').style.display = 'block';
            }
        }

        function renderTable(users) {
            const tbody = document.getElementById('userList');
            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:20px; color:#8b9aab;">暂无用户</td></tr>';
                return;
            }
            let html = '';
            users.forEach(u => {
                const avatarStatus = u.avatarBanned ? '🚫 封禁' : '✅ 正常';
                const banBtn = u.avatarBanned
                    ? `<button class="btn-sm btn-unban" data-uid="${u.uid}" data-action="unban">解封</button>`
                    : `<button class="btn-sm btn-ban" data-uid="${u.uid}" data-action="ban">封禁</button>`;
                html += `
                    <tr>
                        <td><code>${u.uid}</code></td>
                        <td>${u.name}</td>
                        <td>${u.gender}</td>
                        <td>${u.grade}</td>
                        <td>${u.class}</td>
                        <td>${avatarStatus}</td>
                        <td style="text-align:center; white-space:nowrap;">
                            ${banBtn}
                            <button class="btn-sm btn-msg" data-uid="${u.uid}">📨 发消息</button>
                            <button class="btn-sm btn-danger" data-uid="${u.uid}" onclick="deleteUser('${u.uid}')">删除</button>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;

            // 绑定封禁/解封事件
            document.querySelectorAll('.btn-ban, .btn-unban').forEach(btn => {
                btn.addEventListener('click', async function() {
                    const uid = this.dataset.uid;
                    const action = this.dataset.action;
                    if (!confirm(`确定要${action === 'ban' ? '封禁' : '解封'}用户 ${uid} 的头像吗？`)) return;
                    try {
                        const fd = new FormData();
                        fd.append('uid', uid);
                        fd.append('action', action);
                        const res = await fetch('/api/adminBanAvatar', {
                            method: 'POST',
                            credentials: 'include',
                            body: fd
                        });
                        const result = await res.json();
                        if (result.success) {
                            alert(`✅ 已${action === 'ban' ? '封禁' : '解封'}用户头像`);
                            loadUsers(); // 刷新
                        } else {
                            alert(result.error || '操作失败');
                        }
                    } catch (err) {
                        alert('网络错误');
                    }
                });
            });

            // 绑定发送消息按钮
            document.querySelectorAll('.btn-msg').forEach(btn => {
                btn.addEventListener('click', function() {
                    const uid = this.dataset.uid;
                    openMsgModal(uid);
                });
            });
        }

        // 删除用户
        async function deleteUser(uid) {
            if (!confirm(`确定删除用户 ${uid} 吗？此操作不可恢复！`)) return;
            try {
                const fd = new FormData();
                fd.append('uid', uid);
                const res = await fetch('/api/adminDeleteUser', {
                    method: 'POST',
                    credentials: 'include',
                    body: fd
                });
                const result = await res.json();
                if (result.success) {
                    alert('已删除');
                    loadUsers();
                } else {
                    alert(result.error || '删除失败');
                }
            } catch (err) {
                alert('网络错误');
            }
        }

        // 发送消息模态框
        function openMsgModal(uid) {
            document.getElementById('msgToUid').value = uid;
            document.getElementById('msgToUidLabel').textContent = uid;
            document.getElementById('msgContent').value = '';
            document.getElementById('msgModal').style.display = 'flex';
        }
        function closeMsgModal() {
            document.getElementById('msgModal').style.display = 'none';
        }
        document.getElementById('msgModal').addEventListener('click', function(e) {
            if (e.target === this) closeMsgModal();
        });

        document.getElementById('sendMsgBtn').addEventListener('click', async function() {
            const toUid = document.getElementById('msgToUid').value;
            const content = document.getElementById('msgContent').value.trim();
            if (!content) { alert('请输入消息内容'); return; }
            const fd = new FormData();
            fd.append('toUid', toUid);
            fd.append('content', content);
            try {
                const res = await fetch('/api/adminSendMessage', {
                    method: 'POST',
                    credentials: 'include',
                    body: fd
                });
                const result = await res.json();
                if (result.success) {
                    alert('✅ 消息已发送');
                    closeMsgModal();
                } else {
                    alert(result.error || '发送失败');
                }
            } catch (err) {
                alert('网络错误');
            }
        });

        loadUsers();
    </script>
</body>
</html>
