<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布新帖子</title>
	<link rel="icon" href="/favicon.png" type="image/png">
    <link rel="stylesheet" href="/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .app-wrapper { max-width: 1400px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 4px; color: #1a2332; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid rgba(0,0,0,0.06);
            background: rgba(255,255,255,0.5);
            font-family: inherit;
            font-size: 1rem;
        }
        .form-group textarea { resize: vertical; }
        .char-counter { font-size: 0.85rem; color: #8b9aab; text-align: right; margin-top: 2px; }
        .preview-box { background: rgba(255,255,255,0.3); border: 1px solid rgba(255,255,255,0.5); padding: 12px; border-radius: 12px; min-height: 60px; margin-top: 4px; }
        .file-list { margin-top: 4px; }
        .file-item { background: rgba(255,255,255,0.3); padding: 2px 10px; border-radius: 12px; display: inline-block; margin-right: 4px; margin-bottom: 4px; }
        .file-item button { background: #d9534f; color: #fff; border: none; border-radius: 50%; width: 18px; height: 18px; cursor: pointer; }
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
        .sidebar-nav a { display: flex; align-items: center; padding: 8px 16px; color: #1a2332; text-decoration: none; border-radius: 8px; margin: 0 8px; gap: 8px; }
        .sidebar-nav a:hover { background: rgba(26,60,110,0.06); }
        .sidebar-nav a.active { background: rgba(26,60,110,0.1); color: #1a3c6e; font-weight: 500; }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header"><h2>📝 发帖</h2></div>
            <nav class="sidebar-nav">
                <a href="/index.html">🏠 首页</a>
                <a href="/dashboard.html">👤 个人中心</a>
                <a href="/inbox.html">📩 私信</a>
                <a href="/adminLogin.html">🔑 管理</a>
            </nav>
        </aside>

        <main class="main-content" style="padding:20px 28px; max-width: 900px;">
            <h1 class="page-title">📝 发布新帖子</h1>
            <div id="error" class="error" style="display:none;"></div>
            <form id="createForm">
                <!-- 分类 -->
                <div class="form-group">
                    <label>分类</label>
                    <select id="categoryId" required>
                        <option value="">选择分类</option>
                    </select>
                </div>

                <!-- 标题 -->
                <div class="form-group">
                    <label>标题</label>
                    <input type="text" id="title" placeholder="输入标题..." required>
                </div>

                <!-- 内容 -->
                <div class="form-group">
                    <label>内容 (支持Markdown, 最多1000字)</label>
                    <textarea id="content" rows="6" placeholder="写正文..." maxlength="1000" required></textarea>
                    <div class="char-counter"><span id="charCount">0</span>/1000</div>
                    <div class="preview-box" id="preview">预览区域</div>
                </div>

                <!-- 附件 -->
                <div class="form-group">
                    <label>附件 (可选, ≤2MB/个, 最多2个)</label>
                    <input type="file" id="fileInput" multiple accept=".txt,.zip,.rar,.pdf,.doc,.docx,.png,.jpg,.jpeg,.gif,.bmp">
                    <div id="fileList" class="file-list"></div>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn-primary">发布</button>
                    <button type="button" onclick="history.back()" class="btn-secondary">取消</button>
                </div>
            </form>
        </main>
    </div>

    <script>
        let selectedFiles = [];

        // ---------- 实时预览 ----------
        document.getElementById('content').addEventListener('input', function() {
            document.getElementById('charCount').textContent = this.value.length;
            document.getElementById('preview').innerHTML = marked.parse(this.value || '预览区域');
        });

        // ---------- 附件 ----------
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            if (selectedFiles.length + files.length > 2) { alert('最多2个附件'); this.value=''; return; }
            const MAX_SIZE = 2*1024*1024;
            for (let f of files) {
                if (f.size > MAX_SIZE) { alert(`文件 ${f.name} 超过2MB`); this.value=''; return; }
            }
            selectedFiles = selectedFiles.concat(files);
            renderFileList();
            this.value = '';
        });

        function renderFileList() {
            const container = document.getElementById('fileList');
            if (selectedFiles.length === 0) { container.innerHTML=''; return; }
            let html = '';
            selectedFiles.forEach((f,i) => {
                html += `<span class="file-item">${f.name} (${(f.size/1024).toFixed(1)}KB) <button onclick="removeFile(${i})">×</button></span>`;
            });
            container.innerHTML = html;
        }
        function removeFile(i) { selectedFiles.splice(i,1); renderFileList(); }

        // ---------- 加载分类（树形，多级） ----------
        async function loadCategories() {
            try {
                const res = await fetch('/api/categories');
                const data = await res.json();
                const select = document.getElementById('categoryId');
                select.innerHTML = '<option value="">选择分类</option>';

                function addOptions(nodes, prefix = '') {
                    nodes.forEach(node => {
                        const opt = document.createElement('option');
                        opt.value = node.id;
                        opt.textContent = prefix + node.name;
                        select.appendChild(opt);
                        if (node.children && node.children.length > 0) {
                            addOptions(node.children, prefix + '—— ');
                        }
                    });
                }
                addOptions(data.categories);
            } catch (err) {
                console.error('加载分类失败', err);
            }
        }

        // ---------- 提交 ----------
        document.getElementById('createForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const title = document.getElementById('title').value.trim();
            const content = document.getElementById('content').value.trim();
            const categoryId = document.getElementById('categoryId').value;
            if (!title || !content) { alert('标题和内容都不能为空'); return; }
            if (content.length > 1000) { alert('内容超过1000字限制'); return; }
            if (!categoryId) { alert('请选择分类'); return; }

            // 上传附件
            let attachments = [];
            for (let f of selectedFiles) {
                const fd = new FormData();
                fd.append('file', f);
                try {
                    const res = await fetch('/api/uploadFile', { method: 'POST', credentials: 'include', body: fd });
                    const result = await res.json();
                    if (result.success) attachments.push(result.attachment);
                    else { alert(`文件 ${f.name} 上传失败`); return; }
                } catch (err) { alert('附件上传失败'); return; }
            }

            const postFd = new FormData();
            postFd.append('title', title);
            postFd.append('content', content);
            postFd.append('categoryId', categoryId);
            postFd.append('attachments', JSON.stringify(attachments));

            try {
                const res = await fetch('/api/createPost', { method: 'POST', credentials: 'include', body: postFd });
                const result = await res.json();
                if (result.success) { alert('发布成功！'); window.location.href = '/index.html'; }
                else alert(result.error);
            } catch (err) { alert('网络错误'); }
        });

        // ---------- 启动 ----------
        loadCategories();
    </script>
</body>
</html>
