<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分类管理</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .category-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(4px);
            padding: 8px 14px;
            border-radius: 10px;
            margin-bottom: 6px;
            border: 1px solid rgba(255,255,255,0.5);
        }
        .category-item .name { font-weight: 500; }
        .category-item .desc { font-size: 0.8rem; color: #6b7a8a; margin-left: 8px; }
        .category-actions button { margin-left: 4px; }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .modal-content {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(20px);
            padding: 24px;
            border-radius: 24px;
            max-width: 450px;
            width: 90%;
        }
        .modal-content input, .modal-content select, .modal-content textarea {
            width: 100%;
            margin: 6px 0;
            padding: 8px;
            border-radius: 12px;
            border: 1px solid rgba(0,0,0,0.06);
            background: rgba(255,255,255,0.5);
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }
        .modal-actions button { flex: 1; }
        .admin-menu a.active { background: rgba(26,60,110,0.1); color: #1a3c6e; font-weight:500; }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header"><h2>🔧 管理</h2></div>
            <nav class="sidebar-nav admin-menu">
                <a href="/adminDashboard.html">📊 仪表盘</a>
                <a href="/adminUsers.html">👥 用户管理</a>
                <a href="/adminPosts.html">📝 帖子管理</a>
                <a href="/adminCategories.html" class="active">📂 分类管理</a>
                <a href="/adminStats.html">📊 统计面板</a>
                <a href="/adminSensitive.html">🛡️ 敏感词</a>
                <a href="/adminAnnouncement.html">📢 公告</a>
            </nav>
            <div style="padding:16px; margin-top:auto; border-top:1px solid rgba(0,0,0,0.04);">
                <button onclick="logoutAdmin()" class="btn-secondary btn-sm" style="width:100%;">🚪 退出管理</button>
            </div>
        </aside>

        <main class="main-content">
            <h1 class="page-title">📂 分类管理</h1>
            <button id="addCategoryBtn" class="btn-primary btn-sm" style="margin-bottom:12px;">➕ 新建</button>
            <div id="categoryList">加载中...</div>
            <a href="/adminDashboard.html" style="display:inline-block; margin-top:16px; color:#1a3c6e;">← 返回管理后台</a>
        </main>
    </div>

    <!-- 编辑模态框 -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">新建分类</h3>
            <input type="hidden" id="editId">
            <input type="text" id="editName" placeholder="分类名称" required>
            <textarea id="editDesc" rows="2" placeholder="描述（可选）"></textarea>
            <select id="editParent">
                <option value="0">（顶级分类）</option>
            </select>
            <div class="modal-actions">
                <button id="saveBtn" class="btn-primary">保存</button>
                <button onclick="closeModal()" class="btn-secondary">取消</button>
            </div>
        </div>
    </div>

    <script>
        let categories = [];

        function logoutAdmin() {
            document.cookie = 'adminSession=; Path=/; Max-Age=0';
            window.location.href = '/adminLogin.html';
        }

        async function loadCategories() {
            try {
                const res = await fetch('/api/categories', { credentials: 'include' });
                if (res.status === 401 || res.status === 403) {
                    window.location.href = '/adminLogin.html';
                    return;
                }
                const data = await res.json();
                categories = data.categories || [];
                renderTree(categories);
            } catch (err) {
                document.getElementById('categoryList').innerHTML = '<div style="color:red;">加载失败</div>';
            }
        }

        function renderTree(nodes, level = 0) {
            const container = document.getElementById('categoryList');
            if (!nodes || nodes.length === 0) {
                container.innerHTML = '<div style="color:#999; text-align:center; padding:20px;">暂无分类</div>';
                return;
            }
            let html = '';
            nodes.forEach(node => {
                const indent = '　'.repeat(level);
                html += `
                    <div class="category-item">
                        <div>
                            <span class="name">${indent}${node.name}</span>
                            <span class="desc">${node.description || ''}</span>
                        </div>
                        <div class="category-actions">
                            <button class="btn-sm btn-primary" onclick="editCategory(${node.id})">编辑</button>
                            <button class="btn-sm btn-danger" onclick="deleteCategory(${node.id})">删除</button>
                        </div>
                    </div>
                `;
                if (node.children && node.children.length > 0) {
                    // 递归渲染子分类
                    // 由于我们已经有树形数据，我们可以将子分类直接追加到当前容器，但为了保持顺序，我们递归调用 renderTree 并追加到 container。
                    // 这里我们直接递归调用 renderTree 并传入子节点，但需要保持现有结构，我们将 children 渲染在当前节点下方。
                    // 简单处理：将 children 直接添加到 html 中。
                    html += renderTree(node.children, level + 1);
                }
            });
            container.innerHTML = html;
        }

        // 由于 renderTree 递归处理，需修改为返回字符串
        // 改为使用 generateTreeHTML 函数
        function generateTreeHTML(nodes, level = 0) {
            let html = '';
            nodes.forEach(node => {
                const indent = '　'.repeat(level);
                html += `
                    <div class="category-item">
                        <div>
                            <span class="name">${indent}${node.name}</span>
                            <span class="desc">${node.description || ''}</span>
                        </div>
                        <div class="category-actions">
                            <button class="btn-sm btn-primary" onclick="editCategory(${node.id})">编辑</button>
                            <button class="btn-sm btn-danger" onclick="deleteCategory(${node.id})">删除</button>
                        </div>
                    </div>
                `;
                if (node.children && node.children.length > 0) {
                    html += generateTreeHTML(node.children, level + 1);
                }
            });
            return html;
        }

        // 重写 renderTree
        function renderTree(nodes) {
            const container = document.getElementById('categoryList');
            if (!nodes || nodes.length === 0) {
                container.innerHTML = '<div style="color:#999; text-align:center; padding:20px;">暂无分类</div>';
                return;
            }
            container.innerHTML = generateTreeHTML(nodes);
        }

        // 编辑分类
        async function editCategory(id) {
            const node = findCategoryById(categories, id);
            if (!node) return;
            document.getElementById('editId').value = node.id;
            document.getElementById('editName').value = node.name;
            document.getElementById('editDesc').value = node.description || '';
            document.getElementById('modalTitle').textContent = '编辑分类';

            // 填充父级下拉
            await populateParentSelect(node.id);
            document.getElementById('editParent').value = node.parentId || 0;
            document.getElementById('editModal').style.display = 'flex';
        }

        function findCategoryById(nodes, id) {
            for (let node of nodes) {
                if (node.id === id) return node;
                if (node.children) {
                    const found = findCategoryById(node.children, id);
                    if (found) return found;
                }
            }
            return null;
        }

        async function deleteCategory(id) {
            if (!confirm('确定删除此分类？删除前请确保没有子分类。')) return;
            const fd = new FormData();
            fd.append('id', id);
            try {
                const res = await fetch('/api/adminDeleteCategory', {
                    method: 'POST',
                    credentials: 'include',
                    body: fd
                });
                const result = await res.json();
                if (result.success) {
                    alert('已删除');
                    loadCategories();
                } else {
                    alert(result.error || '删除失败');
                }
            } catch (err) { alert('网络错误'); }
        }

        async function populateParentSelect(excludeId = 0) {
            const select = document.getElementById('editParent');
            select.innerHTML = '<option value="0">（顶级分类）</option>';
            // 获取所有分类的扁平列表
            const res = await fetch('/api/categories', { credentials: 'include' });
            const data = await res.json();
            const all = data.categories || [];
            // 递归展平
            function flatten(nodes, prefix = '') {
                let html = '';
                nodes.forEach(node => {
                    if (node.id === excludeId) return;
                    html += `<option value="${node.id}">${prefix}${node.name}</option>`;
                    if (node.children) {
                        html += flatten(node.children, prefix + '—— ');
                    }
                });
                return html;
            }
            select.innerHTML += flatten(all);
        }

        document.getElementById('addCategoryBtn').addEventListener('click', async function() {
            document.getElementById('editId').value = '';
            document.getElementById('editName').value = '';
            document.getElementById('editDesc').value = '';
            document.getElementById('modalTitle').textContent = '新建分类';
            await populateParentSelect();
            document.getElementById('editModal').style.display = 'flex';
        });

        function closeModal() {
            document.getElementById('editModal').style.display = 'none';
        }
        document.getElementById('editModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        document.getElementById('saveBtn').addEventListener('click', async function() {
            const id = document.getElementById('editId').value;
            const name = document.getElementById('editName').value.trim();
            const description = document.getElementById('editDesc').value.trim();
            const parentId = parseInt(document.getElementById('editParent').value) || 0;
            if (!name) { alert('请输入分类名称'); return; }

            const endpoint = id ? '/api/adminUpdateCategory' : '/api/adminCreateCategory';
            const fd = new FormData();
            if (id) fd.append('id', id);
            fd.append('name', name);
            fd.append('description', description);
            fd.append('parentId', parentId);
            try {
                const res = await fetch(endpoint, { method: 'POST', credentials: 'include', body: fd });
                const result = await res.json();
                if (result.success) {
                    alert(id ? '更新成功' : '创建成功');
                    closeModal();
                    loadCategories();
                } else {
                    alert(result.error || '操作失败');
                }
            } catch (err) { alert('网络错误'); }
        });

        loadCategories();
    </script>
</body>
</html>
