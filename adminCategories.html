<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分类管理</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .app-wrapper { max-width: 1400px; }
        .category-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(4px);
            padding: 6px 14px;
            border-radius: 10px;
            margin-bottom: 4px;
            border: 1px solid rgba(255,255,255,0.4);
        }
        .category-name { font-weight: 500; }
        .category-desc { font-size: 0.8rem; color: #6b7a8a; margin-left: 8px; }
        .edit-btn, .delete-btn {
            border: none;
            padding: 2px 10px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .edit-btn { background: rgba(26,60,110,0.1); color: #1a3c6e; }
        .edit-btn:hover { background: #1a3c6e; color: #fff; }
        .delete-btn { background: rgba(217,83,79,0.1); color: #d9534f; }
        .delete-btn:hover { background: #d9534f; color: #fff; }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .modal-content {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(20px);
            padding: 20px;
            border-radius: 20px;
            max-width: 400px;
            width: 90%;
        }
        .modal-content input, .modal-content select, .modal-content textarea {
            width: 100%;
            margin: 4px 0;
            padding: 6px 10px;
            border-radius: 10px;
            border: 1px solid rgba(0,0,0,0.06);
            background: rgba(255,255,255,0.5);
        }
        .modal-actions { display: flex; gap: 8px; margin-top: 10px; }
        .modal-actions button { flex: 1; }
        .admin-menu a {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            margin: 0 8px;
            border-radius: 8px;
            color: #1a2332;
            text-decoration: none;
            gap: 8px;
        }
        .admin-menu a:hover { background: rgba(26,60,110,0.06); }
        .admin-menu a.active { background: rgba(26,60,110,0.1); color: #1a3c6e; font-weight:500; }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header"><h2>🔧 管理</h2></div>
            <nav class="sidebar-nav admin-menu">
                <a href="/adminDashboard.html">📊 仪表盘</a>
                <a href="/adminUsers.html">👥 用户管理</a>
                <a href="/adminPosts.html">📝 帖子管理</a>
                <a href="/adminCategories.html" class="active">📂 分类管理</a>
                <a href="/adminSensitive.html">🛡️ 敏感词</a>
                <a href="/adminAnnouncement.html">📢 公告</a>
            </nav>
            <div style="padding:16px; margin-top:auto; border-top:1px solid rgba(0,0,0,0.04);">
                <button onclick="location.href='/adminLogin.html'" class="btn-secondary btn-sm" style="width:100%;">🚪 退出管理</button>
            </div>
        </aside>

        <main class="main-content">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; margin-bottom:12px;">
                <h1 class="page-title" style="margin-bottom:0;">📂 分类管理</h1>
                <button id="addCategoryBtn" class="btn-primary">➕ 新建</button>
            </div>
            <div id="categoryList">加载中...</div>
        </main>
    </div>

    <!-- 编辑/新建模态框 -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">新建分类</h3>
            <input type="hidden" id="editId">
            <input type="text" id="editName" placeholder="分类名称" required>
            <textarea id="editDesc" rows="2" placeholder="描述（可选）"></textarea>
            <select id="editParent">
                <option value="0">（顶级分类）</option>
            </select>
            <div class="modal-actions">
                <button id="saveBtn" class="btn-primary">保存</button>
                <button onclick="closeModal()" class="btn-secondary">取消</button>
            </div>
        </div>
    </div>

    <script>
        async function getCategoryTree() {
            const res = await fetch('/api/categories');
            const data = await res.json();
            return data.categories || [];
        }

        function buildTreeHTML(nodes, level = 0) {
            let html = '';
            nodes.forEach(node => {
                const indent = '　'.repeat(level);
                html += `
                    <div class="category-item">
                        <div>
                            <span class="category-name">${indent}${node.name}</span>
                            <span class="category-desc">${node.description || ''}</span>
                        </div>
                        <div>
                            <button class="edit-btn" data-id="${node.id}" data-name="${node.name}" data-desc="${node.description || ''}" data-parent="${node.parentId || 0}">编辑</button>
                            <button class="delete-btn" data-id="${node.id}">删除</button>
                        </div>
                    </div>
                `;
                if (node.children && node.children.length > 0) {
                    html += buildTreeHTML(node.children, level + 1);
                }
            });
            return html;
        }

        async function loadCategories() {
            try {
                const tree = await getCategoryTree();
                const container = document.getElementById('categoryList');
                if (!tree || tree.length === 0) {
                    container.innerHTML = '<div style="color:#999; text-align:center; padding:20px;">暂无分类</div>';
                    return;
                }
                const html = buildTreeHTML(tree);
                container.innerHTML = html;

                document.querySelectorAll('.edit-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        openEditModal(parseInt(this.dataset.id), this.dataset.name, this.dataset.desc, parseInt(this.dataset.parent));
                    });
                });
                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', async function() {
                        const id = parseInt(this.dataset.id);
                        if (!confirm('确定删除此分类？请确保没有子分类。')) return;
                        try {
                            const fd = new FormData();
                            fd.append('id', id);
                            const res = await fetch('/api/adminDeleteCategory', { method: 'POST', credentials: 'include', body: fd });
                            const result = await res.json();
                            if (result.success) { alert('已删除'); loadCategories(); }
                            else alert(result.error);
                        } catch (err) { alert('网络错误'); }
                    });
                });
            } catch (err) {
                document.getElementById('categoryList').innerHTML = '<div style="color:red;">加载失败</div>';
            }
        }

        function populateParentSelect(tree, select, excludeId = 0, prefix = '') {
            tree.forEach(node => {
                if (node.id === excludeId) return;
                const opt = document.createElement('option');
                opt.value = node.id;
                opt.textContent = prefix + node.name;
                select.appendChild(opt);
                if (node.children && node.children.length > 0) {
                    populateParentSelect(node.children, select, excludeId, prefix + '—— ');
                }
            });
        }

        async function openEditModal(id = null, name = '', desc = '', parent = 0) {
            document.getElementById('editId').value = id || '';
            document.getElementById('editName').value = name;
            document.getElementById('editDesc').value = desc;
            document.getElementById('modalTitle').textContent = id ? '编辑分类' : '新建分类';
            const select = document.getElementById('editParent');
            select.innerHTML = '<option value="0">（顶级分类）</option>';
            const tree = await getCategoryTree();
            populateParentSelect(tree, select, id || 0);
            if (parent) select.value = parent;
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('editModal').style.display = 'none'; }
        document.getElementById('editModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        document.getElementById('addCategoryBtn').addEventListener('click', () => openEditModal());

        document.getElementById('saveBtn').addEventListener('click', async function() {
            const id = document.getElementById('editId').value;
            const name = document.getElementById('editName').value.trim();
            const description = document.getElementById('editDesc').value.trim();
            const parentId = parseInt(document.getElementById('editParent').value) || 0;
            if (!name) { alert('请输入分类名称'); return; }
            const endpoint = id ? '/api/adminUpdateCategory' : '/api/adminCreateCategory';
            const fd = new FormData();
            if (id) fd.append('id', id);
            fd.append('name', name);
            fd.append('description', description);
            fd.append('parentId', parentId);
            try {
                const res = await fetch(endpoint, { method: 'POST', credentials: 'include', body: fd });
                const result = await res.json();
                if (result.success) { alert(id ? '更新成功' : '创建成功'); closeModal(); loadCategories(); }
                else alert(result.error);
            } catch (err) { alert('网络错误'); }
        });

        loadCategories();
    </script>
</body>
</html>
