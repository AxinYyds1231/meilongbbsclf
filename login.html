<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>梅陇中学论坛 - 登录</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container" style="max-width: 420px; text-align: center;">
        <h1>🔐 梅陇中学论坛</h1>
        <h2 style="margin-bottom: 16px;">用户登录</h2>
        <div id="error" class="error" style="display:none;"></div>
        <form id="loginForm">
            <div class="form-group">
                <label>UID</label>
                <input type="text" id="uid" placeholder="如 ml20300101" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" placeholder="密码" required>
            </div>
            <button type="submit" class="btn-primary" style="width:100%;">登录</button>
        </form>
        <p style="margin-top:16px;">还没有账号？<a href="/register.html">立即注册</a></p>
        <p><a href="/adminLogin.html">管理员登录</a></p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const uid = document.getElementById('uid').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorEl = document.getElementById('error');
            errorEl.style.display = 'none';

            if (!uid || !password) {
                errorEl.textContent = '请填写完整信息';
                errorEl.style.display = 'block';
                return;
            }

            const fd = new FormData();
            fd.append('uid', uid);
            fd.append('password', password);

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    credentials: 'include',
                    body: fd
                });
                const result = await res.json();
                if (result.success) {
                    window.location.href = '/index.html';
                } else {
                    errorEl.textContent = result.error || '登录失败';
                    errorEl.style.display = 'block';
                }
            } catch (err) {
                errorEl.textContent = '网络错误，请重试';
                errorEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
