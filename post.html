<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帖子详情</title>
	<link rel="icon" href="/favicon.png" type="image/png">
    <link rel="stylesheet" href="/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .app-wrapper { max-width: 1400px; }
        .post-detail {
            background: rgba(255,255,255,0.4);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .post-title { font-size: 1.5rem; font-weight: 700; color: #1a2332; margin-bottom: 8px; }
        .post-meta { color: #6b7a8a; font-size: 0.9rem; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
        .post-meta a { color: #1a3c6e; }
        .post-content { margin: 16px 0; line-height: 1.8; }
        .post-content img { max-width: 100%; border-radius: 12px; }
        .post-content pre { background: rgba(0,0,0,0.06); padding: 12px; border-radius: 12px; overflow-x: auto; }
        .reply-item {
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.4);
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 8px;
        }
        .reply-item .meta { font-size: 0.85rem; color: #6b7a8a; }
        .reply-item .content { margin-top: 4px; }
        .reply-form { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
        .reply-form textarea { width: 100%; padding: 10px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.06); background: rgba(255,255,255,0.5); resize: vertical; font-family: inherit; }
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
        .btn-danger { background: rgba(217,83,79,0.12); color: #d9534f; border: 1px solid rgba(217,83,79,0.15); padding: 4px 14px; border-radius: 30px; cursor: pointer; }
        .btn-danger:hover { background: #d9534f; color: #fff; }
        .vote-btn { background: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.8); padding: 4px 14px; border-radius: 30px; cursor: pointer; margin-right: 4px; }
        .vote-btn:hover { background: rgba(255,255,255,0.9); }
        .attachment-link { background: rgba(255,255,255,0.3); padding: 2px 10px; border-radius: 12px; display: inline-block; margin-right: 4px; color: #1a3c6e; }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header"><h2>📄 帖子</h2></div>
            <nav class="sidebar-nav">
                <a href="/index.html">🏠 首页</a>
                <a href="/dashboard.html">👤 个人中心</a>
                <a href="/inbox.html">📩 私信</a>
                <a href="/adminLogin.html">🔑 管理</a>
            </nav>
        </aside>

        <main class="main-content" style="padding:20px 28px;">
            <div id="postContainer">加载中...</div>
        </main>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');

        async function loadPost() {
            if (!postId) {
                document.getElementById('postContainer').innerHTML = '<div style="color:red;">缺少帖子ID</div>';
                return;
            }
            try {
                const res = await fetch(`/api/post?id=${postId}`);
                if (res.status === 404) {
                    document.getElementById('postContainer').innerHTML = '<div style="color:red;">帖子不存在</div>';
                    return;
                }
                const data = await res.json();
                const post = data.post;
                const time = new Date(post.createdAt).toLocaleString('zh-CN');

                // 获取当前用户
                const userRes = await fetch('/api/user', { credentials: 'include' });
                let currentUser = null;
                if (userRes.status === 200) currentUser = (await userRes.json()).user;
                let isAdmin = false;
                try {
                    const adminRes = await fetch('/api/adminDashboard', { credentials: 'include' });
                    if (adminRes.status === 200) isAdmin = true;
                } catch (e) {}

                // 删除按钮
                let deleteHtml = '';
                if (currentUser && (currentUser.uid === post.authorUid || isAdmin)) {
                    deleteHtml = `
                        <button id="deletePostBtn" class="btn-danger">🗑️ 删除帖子</button>
                        ${isAdmin ? `<button id="adminDeleteBtn" class="btn-danger" style="background:rgba(217,83,79,0.2);">🔧 管理删除</button>` : ''}
                    `;
                }

                // 收藏按钮
                let favHtml = `<button id="favoriteBtn" class="btn-secondary btn-sm">☆ 收藏</button>`;

                // 附件
                let attHtml = '';
                if (post.attachments && post.attachments.length > 0) {
                    attHtml = '<div><strong>📎 附件：</strong>';
                    post.attachments.forEach(att => {
                        const dataUri = `data:${att.type};base64,${att.data}`;
                        attHtml += `<a href="${dataUri}" download="${att.name}" class="attachment-link">${att.name}</a>`;
                    });
                    attHtml += '</div>';
                }

                // 内容（Markdown）
                const contentHtml = marked.parse(post.content);

                let html = `
                    <div class="post-detail">
                        <div class="post-title">${post.title}</div>
                        <div class="post-meta">
                            <span>📂 ${post.categoryName || '未分类'}</span>
                            <span>✍️ <a href="/profile.html?uid=${post.authorUid}">${post.authorName}</a></span>
                            <span>🕒 ${time}</span>
                            <span>👍 ${post.likesCount}</span>
                            <span>👎 ${post.dislikesCount}</span>
                        </div>
                        <div class="post-content">${contentHtml}</div>
                        ${attHtml}
                        <div class="btn-group">
                            ${favHtml}
                            <button class="vote-btn" data-target="post" data-type="like">👍 ${post.likesCount}</button>
                            <button class="vote-btn" data-target="post" data-type="dislike">👎 ${post.dislikesCount}</button>
                            ${deleteHtml}
                        </div>
                    </div>
                    <h3>💬 全部回复 (${post.replies.length})</h3>
                    <div id="replies">
                `;

                if (post.replies.length === 0) {
                    html += '<div style="color:#999;">还没有回复</div>';
                } else {
                    post.replies.forEach(r => {
                        const rt = new Date(r.createdAt).toLocaleString('zh-CN');
                        html += `
                            <div class="reply-item">
                                <div class="meta">${r.name} · ${rt}</div>
                                <div class="content">${r.content}</div>
                                <div class="btn-group">
                                    <button class="vote-btn" data-target="reply" data-postid="${postId}" data-replyindex="${r.id}" data-type="like">👍 ${r.likes ? r.likes.length : 0}</button>
                                    <button class="vote-btn" data-target="reply" data-postid="${postId}" data-replyindex="${r.id}" data-type="dislike">👎 ${r.dislikes ? r.dislikes.length : 0}</button>
                                </div>
                            </div>
                        `;
                    });
                }

                html += `
                    </div>
                    <div class="reply-form">
                        <textarea id="replyContent" rows="3" placeholder="回复内容... (支持Markdown)"></textarea>
                        <button id="replyBtn" class="btn-primary">提交回复</button>
                    </div>
                `;
                document.getElementById('postContainer').innerHTML = html;

                // ---------- 绑定事件 ----------
                // 回复
                document.getElementById('replyBtn').addEventListener('click', async function() {
                    const content = document.getElementById('replyContent').value.trim();
                    if (!content) { alert('请输入内容'); return; }
                    const fd = new FormData();
                    fd.append('postId', postId);
                    fd.append('content', content);
                    try {
                        const res = await fetch('/api/reply', { method: 'POST', credentials: 'include', body: fd });
                        const result = await res.json();
                        if (result.success) { alert('回复成功'); loadPost(); }
                        else alert(result.error);
                    } catch (err) { alert('网络错误'); }
                });

                // 收藏
                document.getElementById('favoriteBtn')?.addEventListener('click', async function() {
                    const fd = new FormData();
                    fd.append('postId', postId);
                    try {
                        const res = await fetch('/api/favorite', { method: 'POST', credentials: 'include', body: fd });
                        const result = await res.json();
                        if (result.favorited) {
                            this.textContent = '⭐ 已收藏';
                            this.style.background = 'rgba(255,215,0,0.2)';
                        } else {
                            this.textContent = '☆ 收藏';
                            this.style.background = '';
                        }
                    } catch (err) { alert('网络错误'); }
                });

                // 投票
                document.querySelectorAll('.vote-btn').forEach(btn => {
                    btn.addEventListener('click', async function() {
                        const target = this.dataset.target;
                        const type = this.dataset.type;
                        const postId = this.dataset.postid || urlParams.get('id');
                        const replyIndex = this.dataset.replyindex || null;
                        const fd = new FormData();
                        fd.append('target', target);
                        fd.append('postId', postId);
                        fd.append('type', type);
                        if (replyIndex !== null) fd.append('replyIndex', replyIndex);
                        try {
                            const res = await fetch('/api/like', { method: 'POST', credentials: 'include', body: fd });
                            const result = await res.json();
                            if (result.success) loadPost();
                            else alert(result.error);
                        } catch (err) { alert('网络错误'); }
                    });
                });

                // 删除
                document.getElementById('deletePostBtn')?.addEventListener('click', function() {
                    if (!confirm('确定删除？')) return;
                    const fd = new FormData();
                    fd.append('postId', postId);
                    fetch('/api/deleteMyPost', { method: 'POST', credentials: 'include', body: fd })
                        .then(r => r.json())
                        .then(res => {
                            if (res.success) { alert('已删除'); location.href = '/index.html'; }
                            else alert(res.error);
                        });
                });
                document.getElementById('adminDeleteBtn')?.addEventListener('click', function() {
                    const reason = prompt('请输入删除原因：');
                    if (reason && reason.trim()) {
                        const fd = new FormData();
                        fd.append('postId', postId);
                        fd.append('reason', reason);
                        fetch('/api/adminDeletePostWithReason', { method: 'POST', credentials: 'include', body: fd })
                            .then(r => r.json())
                            .then(res => {
                                if (res.success) { alert('已删除'); location.href = '/index.html'; }
                                else alert(res.error);
                            });
                    }
                });

            } catch (err) {
                document.getElementById('postContainer').innerHTML = '<div style="color:red;">加载失败</div>';
            }
        }

        loadPost();
    </script>
</body>
</html>
