<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的收藏</title>
	<link rel="icon" href="/favicon.png" type="image/png">
    <link rel="stylesheet" href="/style.css">
    <style>
        .app-wrapper { max-width: 1400px; }
        .fav-item {
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(4px);
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 8px;
            border: 1px solid rgba(255,255,255,0.4);
            cursor: pointer;
            transition: 0.15s;
        }
        .fav-item:hover { background: rgba(255,255,255,0.6); }
        .sidebar-nav a {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            color: #1a2332;
            text-decoration: none;
            border-radius: 8px;
            margin: 0 8px;
            gap: 8px;
        }
        .sidebar-nav a:hover { background: rgba(26,60,110,0.06); }
        .sidebar-nav a.active { background: rgba(26,60,110,0.1); color: #1a3c6e; font-weight: 500; }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header"><h2>⭐ 我的收藏</h2></div>
            <nav class="sidebar-nav">
                <a href="/index.html">🏠 首页</a>
                <a href="/dashboard.html">👤 个人中心</a>
                <a href="/inbox.html">📩 私信</a>
                <a href="/adminLogin.html">🔑 管理</a>
            </nav>
        </aside>

        <main class="main-content">
            <h1 class="page-title">⭐ 我的收藏</h1>
            <div id="favList">加载中...</div>
        </main>
    </div>

    <script>
        async function loadFavorites() {
            try {
                const res = await fetch('/api/favorites', { credentials: 'include' });
                if (res.status === 401) { window.location.href = '/login.html'; return; }
                const data = await res.json();
                const container = document.getElementById('favList');
                if (!data.favorites || data.favorites.length === 0) {
                    container.innerHTML = '<div style="color:#999;">暂无收藏帖子</div>';
                    return;
                }
                let html = '';
                data.favorites.forEach(p => {
                    const time = new Date(p.createdAt).toLocaleString('zh-CN');
                    html += `
                        <div class="fav-item" onclick="location.href='/post.html?id=${p.id}'">
                            <div style="font-weight:600;">${p.title}</div>
                            <div style="font-size:0.85rem;color:#6b7a8a;">✍️ ${p.authorName} · 🕒 ${time} · 💬 ${p.replyCount}</div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (err) {
                document.getElementById('favList').innerHTML = '<div style="color:red;">加载失败</div>';
            }
        }
        loadFavorites();
    </script>
</body>
</html>
