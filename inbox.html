<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>私信</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .app-wrapper { max-width: 1400px; }
        .chat-container {
            display: flex;
            height: 100%;
            gap: 0;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(4px);
            border-radius: 16px;
            overflow: hidden;
        }
        .contact-list {
            width: 260px;
            min-width: 260px;
            background: rgba(255,255,255,0.3);
            border-right: 1px solid rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            max-height: 70vh;
        }
        .contact-list .header {
            padding: 12px 16px;
            font-weight: 600;
            border-bottom: 1px solid rgba(0,0,0,0.06);
            background: rgba(255,255,255,0.2);
        }
        .contact-list .search-area {
            padding: 8px 12px;
            border-bottom: 1px solid rgba(0,0,0,0.06);
        }
        .contact-list .search-area input {
            width: 100%;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(0,0,0,0.06);
            background: rgba(255,255,255,0.4);
            font-size: 0.9rem;
        }
        .contact-list .search-results {
            padding: 4px 8px;
            max-height: 120px;
            overflow-y: auto;
        }
        .contact-list .contacts {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0;
        }
        .contact-item {
            display: flex;
            align-items: center;
            padding: 8px 14px;
            cursor: pointer;
            transition: background 0.15s;
            gap: 10px;
            border-bottom: 1px solid rgba(0,0,0,0.02);
        }
        .contact-item:hover { background: rgba(255,255,255,0.3); }
        .contact-item.active { background: rgba(26,60,110,0.08); }
        .contact-item .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.5);
        }
        .contact-item .info {
            flex: 1;
            overflow: hidden;
        }
        .contact-item .info .name {
            font-weight: 500;
            font-size: 0.95rem;
        }
        .contact-item .info .last-msg {
            font-size: 0.8rem;
            color: #6b7a8a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .contact-item .unread-badge {
            background: #d9534f;
            color: #fff;
            border-radius: 50%;
            padding: 0px 6px;
            font-size: 0.7rem;
            min-width: 18px;
            text-align: center;
            line-height: 18px;
        }

        .chat-window {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(255,255,255,0.1);
        }
        .chat-window .chat-header {
            padding: 10px 16px;
            border-bottom: 1px solid rgba(0,0,0,0.06);
            background: rgba(255,255,255,0.15);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chat-window .chat-header img {
            width: 30px;
            height: 30px;
            border-radius: 50%;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .chat-message {
            max-width: 75%;
            padding: 6px 12px;
            border-radius: 16px;
            word-wrap: break-word;
            position: relative;
        }
        .chat-message .sender-name {
            font-size: 0.7rem;
            color: #6b7a8a;
            margin-bottom: 2px;
        }
        .chat-message .time {
            font-size: 0.6rem;
            color: #8b9aab;
            margin-left: 6px;
        }
        .chat-message.sent {
            align-self: flex-end;
            background: #1a3c6e;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .chat-message.sent .sender-name { color: rgba(255,255,255,0.6); }
        .chat-message.received {
            align-self: flex-start;
            background: rgba(255,255,255,0.6);
            border-bottom-left-radius: 4px;
        }
        .chat-message.system {
            align-self: center;
            background: rgba(0,0,0,0.04);
            color: #6b7a8a;
            font-size: 0.8rem;
            padding: 4px 12px;
            border-radius: 12px;
            max-width: 90%;
        }
        .chat-input {
            display: flex;
            gap: 8px;
            padding: 10px 16px;
            border-top: 1px solid rgba(0,0,0,0.06);
            background: rgba(255,255,255,0.1);
        }
        .chat-input textarea {
            flex: 1;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(0,0,0,0.06);
            background: rgba(255,255,255,0.4);
            resize: none;
            font-family: inherit;
            font-size: 0.95rem;
            height: 40px;
        }
        .chat-input button {
            align-self: flex-end;
            height: 40px;
        }
        .empty-state {
            color: #999;
            text-align: center;
            padding: 40px 0;
            font-size: 0.95rem;
        }
        @media (max-width: 768px) {
            .contact-list { width: 100%; min-width: unset; max-height: 150px; border-right: none; border-bottom: 1px solid rgba(0,0,0,0.06); }
            .chat-container { flex-direction: column; }
        }
        .sidebar-nav a {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            color: #1a2332;
            text-decoration: none;
            border-radius: 8px;
            margin: 0 8px;
            gap: 8px;
        }
        .sidebar-nav a:hover { background: rgba(26,60,110,0.06); }
        .sidebar-nav a.active { background: rgba(26,60,110,0.1); color: #1a3c6e; font-weight: 500; }
        .btn-sm { padding: 3px 12px; font-size: 0.8rem; }
        .btn-primary { background: #1a3c6e; color: #fff; border: none; padding: 6px 18px; border-radius: 30px; cursor: pointer; }
        .btn-primary:hover { background: #2a5a8e; }
        .btn-secondary { background: rgba(0,0,0,0.06); color: #1a2332; border: 1px solid rgba(0,0,0,0.06); padding: 6px 18px; border-radius: 30px; cursor: pointer; }
        .avatar-sm { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header"><h2>📩 私信</h2></div>
            <nav class="sidebar-nav">
                <a href="/index.html">🏠 首页</a>
                <a href="/dashboard.html">👤 个人中心</a>
                <a href="/inbox.html" class="active">📩 私信</a>
                <a href="/adminLogin.html">🔑 管理</a>
            </nav>
        </aside>

        <main class="main-content" style="padding:16px 20px;">
            <div class="chat-container">
                <!-- 左侧联系人列表 -->
                <div class="contact-list">
                    <div class="header">联系人</div>
                    <div class="search-area">
                        <input type="text" id="searchInput" placeholder="搜索用户UID/姓名...">
                        <div id="searchResults" class="search-results"></div>
                    </div>
                    <div class="contacts" id="contacts">加载中...</div>
                </div>

                <!-- 右侧聊天窗口 -->
                <div class="chat-window">
                    <div class="chat-header" id="chatHeader">
                        <span>选择联系人开始聊天</span>
                    </div>
                    <div class="chat-messages" id="chatMessages">
                        <div class="empty-state">暂无消息</div>
                    </div>
                    <div class="chat-input" id="chatInput" style="display:none;">
                        <textarea id="msgContent" rows="1" placeholder="输入消息..." maxlength="500"></textarea>
                        <button id="sendBtn" class="btn-primary btn-sm">发送</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let currentContact = null;
        let allContacts = [];
        let allMessages = [];
        let currentUser = null;

        // ---- 获取当前用户 ----
        async function getCurrentUser() {
            try {
                const res = await fetch('/api/user', { credentials: 'include' });
                if (res.status === 200) {
                    const data = await res.json();
                    currentUser = data.user;
                }
            } catch (e) {}
        }

        // ---- 加载联系人 ----
        async function loadContacts() {
            const container = document.getElementById('contacts');
            container.innerHTML = '加载中...';
            try {
                const inboxRes = await fetch('/api/inbox', { credentials: 'include' });
                if (inboxRes.status === 401) { window.location.href = '/login.html'; return; }
                if (!inboxRes.ok) throw new Error(`HTTP ${inboxRes.status}`);
                const inboxData = await inboxRes.json();
                const msgs = Array.isArray(inboxData.messages) ? inboxData.messages : [];

                const contactsRes = await fetch('/api/contacts', { credentials: 'include' });
                let savedContacts = [];
                if (contactsRes.ok) {
                    const contactsData = await contactsRes.json();
                    savedContacts = Array.isArray(contactsData.contacts) ? contactsData.contacts : [];
                }

                const map = {};
                // 从消息中提取联系人
                msgs.forEach(m => {
                    // 确定对方是谁
                    let contactUid;
                    if (m.fromUid === currentUser?.uid) {
                        contactUid = m.toUid;
                    } else {
                        contactUid = m.fromUid;
                    }
                    if (!map[contactUid]) {
                        map[contactUid] = { uid: contactUid, lastMsg: m.content, lastTime: m.sentAt, unread: !m.read };
                    } else {
                        if (m.sentAt > map[contactUid].lastTime) {
                            map[contactUid].lastMsg = m.content;
                            map[contactUid].lastTime = m.sentAt;
                        }
                        if (!m.read) map[contactUid].unread = true;
                    }
                });
                // 添加已保存联系人
                savedContacts.forEach(uid => {
                    if (!map[uid]) {
                        map[uid] = { uid, lastMsg: '暂无消息', lastTime: 0, unread: false };
                    }
                });
                // 确保 admin 存在（如果不是当前用户）
                if (currentUser?.uid !== 'admin' && !map['admin']) {
                    map['admin'] = { uid: 'admin', lastMsg: '管理员', lastTime: 0, unread: false };
                }

                allContacts = Object.values(map).sort((a, b) => b.lastTime - a.lastTime);
                renderContacts();
                if (allContacts.length > 0 && !currentContact) {
                    selectContact(allContacts[0].uid);
                } else if (allContacts.length === 0) {
                    document.getElementById('chatMessages').innerHTML = '<div class="empty-state">暂无消息，搜索添加联系人</div>';
                }
            } catch (err) {
                console.error(err);
                container.innerHTML = `<div style="color:red; padding:8px;">加载失败: ${err.message}</div>`;
            }
        }

        function renderContacts() {
            const container = document.getElementById('contacts');
            if (allContacts.length === 0) {
                container.innerHTML = '<div style="color:#999; padding:8px;">暂无联系人</div>';
                return;
            }
            let html = '';
            allContacts.forEach(c => {
                const active = currentContact === c.uid ? 'active' : '';
                const unread = c.unread ? `<span class="unread-badge">●</span>` : '';
                const displayName = c.uid === 'admin' ? '🔔 管理员' : c.uid;
                html += `
                    <div class="contact-item ${active}" data-uid="${c.uid}">
                        <img src="" class="avatar" onerror="this.src=''">
                        <div class="info">
                            <div class="name">${displayName}</div>
                            <div class="last-msg">${c.lastMsg}</div>
                        </div>
                        ${unread}
                    </div>
                `;
            });
            container.innerHTML = html;
            container.querySelectorAll('.contact-item').forEach(el => {
                el.addEventListener('click', function() {
                    selectContact(this.dataset.uid);
                });
            });
        }

        // ---- 选择联系人 ----
        async function selectContact(uid) {
            currentContact = uid;
            renderContacts();
            const displayName = uid === 'admin' ? '🔔 管理员' : uid;
            document.getElementById('chatHeader').innerHTML = `<span>${displayName}</span>`;

            try {
                const res = await fetch('/api/inbox', { credentials: 'include' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                const msgs = Array.isArray(data.messages) ? data.messages : [];

                // 关键修复：过滤出与当前联系人的所有消息（包括自己发送的）
                const filtered = msgs.filter(m => {
                    // 发送者和接收者中，一个等于当前用户，另一个等于选中的联系人（或 admin）
                    const fromMe = m.fromUid === currentUser?.uid;
                    const toMe = m.toUid === currentUser?.uid;
                    const fromContact = m.fromUid === uid;
                    const toContact = m.toUid === uid;
                    // 如果当前用户是 admin，则需要特殊处理，但逻辑类似
                    return (fromMe && toContact) || (toMe && fromContact) ||
                           (m.fromUid === 'admin' && m.toUid === currentUser?.uid) ||
                           (m.toUid === 'admin' && m.fromUid === currentUser?.uid);
                });

                filtered.sort((a, b) => a.sentAt - b.sentAt);
                allMessages = filtered;
                renderMessages();

                document.getElementById('chatInput').style.display = 'flex';

                // 标记已读
                for (let m of filtered) {
                    if (!m.read && m.fromUid === uid) {
                        await fetch('/api/readMessage', {
                            method: 'POST',
                            credentials: 'include',
                            body: new FormData().append('msgId', m.id)
                        });
                    }
                }
                updateBadge();
            } catch (err) {
                console.error(err);
                document.getElementById('chatMessages').innerHTML = '<div style="color:red;">加载消息失败</div>';
            }
        }

        function renderMessages() {
            const container = document.getElementById('chatMessages');
            if (allMessages.length === 0) {
                container.innerHTML = '<div class="empty-state">暂无消息</div>';
                return;
            }
            let html = '';
            allMessages.forEach(m => {
                const isSent = m.fromUid === currentUser?.uid;
                const isSystem = m.fromUid === 'admin' && m.type === 'system';
                const msgClass = isSystem ? 'system' : (isSent ? 'sent' : 'received');
                const senderName = m.fromUid === 'admin' ? '管理员' : m.fromUid;
                const time = new Date(m.sentAt).toLocaleString('zh-CN');
                html += `
                    <div class="chat-message ${msgClass}">
                        ${!isSent && !isSystem ? `<div class="sender-name">${senderName}</div>` : ''}
                        ${m.content}
                        <span class="time">${time}</span>
                    </div>
                `;
            });
            container.innerHTML = html;
            container.scrollTop = container.scrollHeight;
        }

        // ---- 发送消息 ----
        document.getElementById('sendBtn').addEventListener('click', async function() {
            const content = document.getElementById('msgContent').value.trim();
            if (!content || !currentContact) return;
            const fd = new FormData();
            fd.append('toUid', currentContact);
            fd.append('content', content);
            try {
                const res = await fetch('/api/sendMessage', { method: 'POST', credentials: 'include', body: fd });
                const result = await res.json();
                if (result.success) {
                    document.getElementById('msgContent').value = '';
                    selectContact(currentContact);
                } else {
                    alert(result.error || '发送失败');
                }
            } catch (err) { alert('网络错误'); }
        });

        // ---- 搜索用户 ----
        document.getElementById('searchInput').addEventListener('input', function() {
            const q = this.value.trim();
            const container = document.getElementById('searchResults');
            if (q.length < 1) { container.innerHTML = ''; return; }
            fetch(`/api/searchUsers?q=${encodeURIComponent(q)}`, { credentials: 'include' })
                .then(r => r.json())
                .then(data => {
                    if (!data.users || data.users.length === 0) {
                        container.innerHTML = '<div style="color:#999;padding:4px;">未找到用户</div>';
                        return;
                    }
                    let html = '';
                    data.users.forEach(u => {
                        html += `
                            <div class="search-result-item" data-uid="${u.uid}" style="display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:6px;cursor:pointer;">
                                <img src="${u.avatar || ''}" class="avatar-sm" onerror="this.src=''">
                                <span>${u.name} (${u.uid})</span>
                                <button class="add-contact-btn btn-primary btn-sm" style="margin-left:auto;padding:2px 10px;">添加</button>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                    container.querySelectorAll('.add-contact-btn').forEach(btn => {
                        btn.addEventListener('click', async function(e) {
                            e.stopPropagation();
                            const contactUid = this.closest('.search-result-item').dataset.uid;
                            const fd = new FormData();
                            fd.append('contactUid', contactUid);
                            try {
                                const res = await fetch('/api/addContact', { method: 'POST', credentials: 'include', body: fd });
                                const result = await res.json();
                                if (result.success) {
                                    alert('已添加联系人');
                                    container.innerHTML = '';
                                    document.getElementById('searchInput').value = '';
                                    loadContacts();
                                } else {
                                    alert(result.error || '添加失败');
                                }
                            } catch (err) { alert('网络错误'); }
                        });
                    });
                })
                .catch(err => console.error(err));
        });

        // ---- 未读小红点 ----
        async function updateBadge() {
            try {
                const res = await fetch('/api/inbox', { credentials: 'include' });
                if (res.status === 200) {
                    const data = await res.json();
                    const unread = Array.isArray(data.messages) ? data.messages.filter(m => !m.read).length : 0;
                    const badge = document.querySelector('.sidebar-nav .badge');
                    if (badge) {
                        if (unread > 0) { badge.textContent = unread; badge.style.display = 'inline-block'; }
                        else { badge.style.display = 'none'; }
                    }
                }
            } catch (e) {}
        }

        // ---- 初始化 ----
        (async function init() {
            await getCurrentUser();
            loadContacts();
        })();
    </script>
</body>
</html>
