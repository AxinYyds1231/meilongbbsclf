<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的起始页 · 26.9.a</title>
    <style>
        /* ===== CSS Variables ===== */
        :root {
            --bg-primary: #0b1120;
            --bg-secondary: rgba(255, 255, 255, 0.05);
            --bg-card: rgba(255, 255, 255, 0.07);
            --bg-card-hover: rgba(255, 255, 255, 0.14);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.4);
            --accent: #6c8cff;
            --accent-hover: #5a7ae8;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            --radius: 20px;
            --radius-sm: 12px;
            --radius-full: 60px;
            --transition: 0.3s ease;
            --font: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            --bg-image: none;
            --bg-overlay: rgba(0, 0, 0, 0.55);
        }

        [data-theme="light"] {
            --bg-primary: #eef0f3;
            --bg-secondary: rgba(0, 0, 0, 0.03);
            --bg-card: rgba(255, 255, 255, 0.75);
            --bg-card-hover: rgba(255, 255, 255, 0.92);
            --border-color: rgba(0, 0, 0, 0.08);
            --text-primary: #1a1a2e;
            --text-secondary: rgba(0, 0, 0, 0.65);
            --text-muted: rgba(0, 0, 0, 0.35);
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            --accent: #4a6cf7;
            --accent-hover: #3a5cd9;
            --bg-overlay: rgba(255, 255, 255, 0.6);
        }

        /* ===== Global ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: var(--font);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: background var(--transition), color var(--transition);
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: var(--bg-overlay);
            z-index: 0;
            pointer-events: none;
            transition: background var(--transition);
        }
        .app-container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* ===== Scrollbar ===== */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--text-muted);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        /* ===== Header ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 6px 0 18px;
            flex-wrap: wrap;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
            user-select: none;
        }
        .logo-area span {
            background: var(--accent);
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .header-actions button {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 7px 14px;
            border-radius: var(--radius-full);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all var(--transition);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }
        .header-actions button:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
            border-color: var(--accent);
        }
        .header-actions .three-btn {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .header-actions .three-btn:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }
        .header-actions .theme-btn {
            padding: 7px 12px;
            font-size: 16px;
        }

        /* ===== Clock Widget ===== */
        .clock-section {
            width: 100%;
            text-align: center;
            padding: 20px 0 14px;
            margin-bottom: 10px;
        }
        .clock-widget {
            display: inline-block;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 24px 48px 20px;
            box-shadow: var(--shadow);
            min-width: 280px;
            transition: all var(--transition);
        }
        .clock-widget:hover {
            transform: scale(1.01);
            border-color: rgba(255, 255, 255, 0.15);
        }
        .clock-time {
            font-size: 56px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--text-primary);
            line-height: 1.1;
            font-variant-numeric: tabular-nums;
        }
        .clock-date {
            font-size: 17px;
            color: var(--text-secondary);
            margin-top: 6px;
            font-weight: 400;
            letter-spacing: 0.5px;
        }
        .clock-seconds {
            font-size: 22px;
            font-weight: 300;
            color: var(--text-muted);
            margin-left: 4px;
        }
        @media (max-width: 480px) {
            .clock-widget {
                padding: 18px 24px 16px;
                min-width: auto;
                width: 100%;
            }
            .clock-time {
                font-size: 38px;
            }
            .clock-date {
                font-size: 14px;
            }
            .clock-seconds {
                font-size: 18px;
            }
        }

        /* ===== Search ===== */
        .search-section {
            width: 100%;
            margin-bottom: 28px;
        }
        .search-wrapper {
            display: flex;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-full);
            padding: 4px 4px 4px 20px;
            transition: all var(--transition);
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            max-width: 720px;
            margin: 0 auto;
        }
        .search-wrapper:focus-within {
            border-color: var(--accent);
            box-shadow: 0 4px 30px rgba(108, 140, 255, 0.2);
            transform: scale(1.01);
        }
        .search-wrapper .search-icon {
            font-size: 18px;
            color: var(--text-muted);
            margin-right: 10px;
            flex-shrink: 0;
        }
        .search-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 16px;
            padding: 13px 0;
            font-family: var(--font);
            min-width: 0;
        }
        .search-wrapper input::placeholder {
            color: var(--text-muted);
        }
        .search-wrapper .search-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 11px 28px;
            border-radius: var(--radius-full);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .search-wrapper .search-btn:hover {
            background: var(--accent-hover);
            transform: scale(1.02);
        }

        /* ===== Sites Grid ===== */
        .sites-section {
            flex: 1;
            width: 100%;
        }
        .sites-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .sites-header h2 {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: 0.3px;
        }
        .sites-header .add-btn {
            background: var(--bg-secondary);
            border: 1px dashed var(--border-color);
            color: var(--text-secondary);
            padding: 5px 16px;
            border-radius: var(--radius-full);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sites-header .add-btn:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
            border-color: var(--accent);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 14px;
            width: 100%;
        }
        .grid.dragging {
            opacity: 0.5;
        }

        /* ===== Site Card ===== */
        .site-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 18px 10px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: grab;
            transition: all var(--transition);
            backdrop-filter: blur(8px);
            position: relative;
            user-select: none;
        }
        .site-card:hover {
            background: var(--bg-card-hover);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-3px);
            box-shadow: var(--shadow);
        }
        .site-card .drag-handle {
            position: absolute;
            top: 5px;
            left: 9px;
            font-size: 12px;
            color: var(--text-muted);
            cursor: grab;
            opacity: 0;
            transition: opacity var(--transition);
        }
        .site-card:hover .drag-handle {
            opacity: 1;
        }
        .site-card .card-icon {
            font-size: 32px;
            margin-bottom: 6px;
            line-height: 1.2;
            transition: transform var(--transition);
        }
        .site-card:hover .card-icon {
            transform: scale(1.05);
        }
        .site-card .card-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 3px;
            word-break: break-word;
            line-height: 1.3;
            max-width: 100%;
        }
        .site-card .card-url {
            font-size: 10px;
            color: var(--text-muted);
            word-break: break-all;
            margin-bottom: 8px;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .site-card .card-actions {
            display: flex;
            align-items: center;
            gap: 5px;
            width: 100%;
            margin-top: auto;
        }
        .site-card .open-btn {
            flex: 1;
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 7px 10px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font);
        }
        .site-card .open-btn:hover {
            background: var(--accent-hover);
            transform: scale(1.02);
        }
        .site-card .card-tools {
            display: flex;
            gap: 3px;
            opacity: 0;
            transition: opacity var(--transition);
        }
        .site-card:hover .card-tools {
            opacity: 1;
        }
        .site-card .card-tools button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 13px;
            padding: 3px 5px;
            border-radius: 6px;
            transition: all var(--transition);
            line-height: 1;
        }
        .site-card .card-tools button:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
        }
        .site-card .card-tools .del-btn:hover {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.15);
        }
        .site-card .color-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            border-radius: var(--radius) var(--radius) 0 0;
            transition: height var(--transition);
        }
        .site-card:hover .color-bar {
            height: 4px;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 20px;
            color: var(--text-muted);
        }
        .empty-state .empty-icon {
            font-size: 42px;
            margin-bottom: 10px;
        }

        /* ===== Footer ===== */
        .footer {
            margin-top: 28px;
            padding: 14px 0 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 12px;
        }
        .footer .version {
            font-weight: 600;
            color: var(--text-secondary);
            background: var(--bg-secondary);
            padding: 2px 12px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
        }
        .footer button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 12px;
            transition: color var(--transition);
            font-family: var(--font);
            padding: 4px 8px;
            border-radius: 6px;
        }
        .footer button:hover {
            color: var(--text-primary);
            background: var(--bg-secondary);
        }
        .footer .sep {
            color: var(--border-color);
        }

        /* ===== Modals ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .modal {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 28px 26px 26px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.5);
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal h3 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-primary);
        }
        .modal .modal-sub {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 18px;
        }
        .modal .form-group {
            margin-bottom: 14px;
        }
        .modal .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .modal .form-group input,
        .modal .form-group select {
            width: 100%;
            padding: 11px 14px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 14px;
            font-family: var(--font);
            transition: border-color var(--transition);
            outline: none;
        }
        .modal .form-group input:focus {
            border-color: var(--accent);
        }
        .modal .form-group .icon-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 5px;
            margin-top: 5px;
        }
        .modal .form-group .icon-grid button {
            background: var(--bg-secondary);
            border: 2px solid transparent;
            border-radius: var(--radius-sm);
            padding: 7px 0;
            font-size: 20px;
            cursor: pointer;
            transition: all var(--transition);
        }
        .modal .form-group .icon-grid button:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-color);
        }
        .modal .form-group .icon-grid button.active {
            border-color: var(--accent);
            background: var(--bg-card-hover);
        }
        .modal .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 22px;
            justify-content: flex-end;
        }
        .modal .modal-actions button {
            padding: 9px 26px;
            border-radius: var(--radius-full);
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            font-family: var(--font);
        }
        .modal .modal-actions .btn-cancel {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }
        .modal .modal-actions .btn-cancel:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }
        .modal .modal-actions .btn-confirm {
            background: var(--accent);
            color: #fff;
        }
        .modal .modal-actions .btn-confirm:hover {
            background: var(--accent-hover);
        }

        /* ===== Background Picker ===== */
        .bg-options {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 6px;
        }
        .bg-options .bg-preset {
            aspect-ratio: 16/10;
            border-radius: var(--radius-sm);
            border: 2px solid var(--border-color);
            cursor: pointer;
            transition: all var(--transition);
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .bg-options .bg-preset:hover {
            transform: scale(1.03);
            border-color: var(--accent);
        }
        .bg-options .bg-preset.active {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(108, 140, 255, 0.25);
        }
        .bg-options .bg-preset .bg-label {
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            font-size: 10px;
            padding: 1px 10px;
            border-radius: 20px;
            white-space: nowrap;
        }

        /* ===== Toast ===== */
        .toast-container {
            position: fixed;
            bottom: 28px;
            right: 28px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 380px;
            width: 100%;
            pointer-events: none;
        }
        .toast {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 12px 18px;
            color: var(--text-primary);
            font-size: 13px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
            animation: slideUp 0.35s ease both;
            pointer-events: all;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast.success {
            border-left: 4px solid #4ade80;
        }
        .toast.error {
            border-left: 4px solid #f87171;
        }
        .toast.warning {
            border-left: 4px solid #fbbf24;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            body {
                padding: 14px;
            }
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 10px;
            }
            .site-card {
                padding: 14px 8px 12px;
            }
            .site-card .card-icon {
                font-size: 26px;
            }
            .search-wrapper {
                padding: 4px 4px 4px 14px;
                border-radius: 30px;
            }
            .search-wrapper input {
                font-size: 14px;
                padding: 10px 0;
            }
            .search-wrapper .search-btn {
                padding: 9px 16px;
                font-size: 13px;
            }
            .modal {
                padding: 22px 16px 18px;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .header-actions {
                justify-content: center;
            }
            .logo-area {
                justify-content: center;
            }
            .clock-widget {
                padding: 16px 20px 14px;
            }
            .clock-time {
                font-size: 38px;
            }
            .bg-options {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        @media (max-width: 480px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
                gap: 8px;
            }
            .site-card .card-name {
                font-size: 11px;
            }
            .site-card .open-btn {
                font-size: 10px;
                padding: 5px 6px;
            }
            .search-wrapper .search-btn {
                padding: 7px 12px;
                font-size: 12px;
            }
            .toast-container {
                right: 12px;
                left: 12px;
                max-width: 100%;
                bottom: 12px;
            }
            .clock-time {
                font-size: 30px;
            }
            .clock-seconds {
                font-size: 16px;
            }
            .bg-options {
                grid-template-columns: repeat(2, 1fr);
            }
            .header-actions button {
                font-size: 11px;
                padding: 5px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container" id="app">

        <!-- ===== Header ===== -->
        <header class="header">
            <div class="logo-area">
                <span>🚀</span>
                起始页 <span style="font-size:13px;font-weight:400;color:var(--text-muted);margin-left:4px;">v26.9.a</span>
            </div>
            <div class="header-actions">
                <button class="three-btn" id="threeBtn">⚡ 三连开</button>
                <button class="theme-btn" id="themeToggle" title="切换主题">🌓</button>
                <button id="bgBtn" title="自定义背景">🖼️ 背景</button>
                <button id="resetBtn" title="重置为默认">🔄 重置</button>
                <button id="exportBtn" title="导出配置">📤 导出</button>
                <button id="importBtn" title="导入配置">📥 导入</button>
                <input type="file" id="importFile" accept=".json" style="display:none" />
            </div>
        </header>

        <!-- ===== Clock Widget ===== -->
        <section class="clock-section">
            <div class="clock-widget">
                <div class="clock-time" id="clockTime">

    <!-- ===== Modal: 添加/编辑站点 ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">

        <div class="modal">

            <div class="form-group">
                <label>站点 1</label>

                <label>站点 2</label>
                <input type="text" id="threeUrl2" placeholder="https://www.github.com/" />

            <div class="form-group">
                <label>站点 3</label>
                <input type="text" id="threeUrl3" placeholder="https://chat.deepseek.com/" />
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" id="threeModalCancel">取消</button>
                <button class="btn-confirm" id="threeModalConfirm">保存</button>

    <!-- ===== Modal: 背景设置 ===== -->
    <div class="modal-overlay" id="bgModalOverlay">
        <div class="modal">
            <h3>🖼️ 自定义背景</h3>
            <p class="modal-sub">选择预设背景或上传自定义图片。</p>
            <div class="form-group">
                <label>预设背景</label>
                <div class="bg-options" id="bgOptions">
                    <!-- 由 JS 生成 -->
                </div>

            <div class="form-group">
                <label>上传自定义图片</label>
                <input type="file" id="bgUpload" accept="image/*" style="padding:8px;background:var(--bg-secondary);border-radius:var(--radius-sm);border:1px solid var(--border-color);width:100%;color:var(--text-primary);" />
            </div>
            <div class="form-group" style="margin-bottom:0;">
                <label>或输入图片 URL</label>
                <input type="text" id="bgUrlInput" placeholder="https://example.com/background.jpg" />

            <div class="modal-actions">
                <button class="btn-cancel" id="bgModalCancel">取消</button>
                <button class="btn-confirm" id="bgModalConfirm">应用</button>
                <button class="btn-cancel" id="bgResetBtn" style="margin-right:auto;">重置默认</button>
            </div>
        </div>
    </div>

    <!-- ===== Toast Container ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            //  版本
            // ============================================================
            const VERSION = '26.9.a';

            // ============================================================
            //  默认数据
            // ============================================================
            const DEFAULT_SITES = [
                { id: '1', name: 'Meilong论坛', url: 'https://meilongbbs.pages.dev/', icon: '💬', color: '#4A90D9' },
                { id: '2', name: '微信传输', url: 'https://filehelper.weixin.qq.com/', icon: '📁', color: '#07C160' },
                { id: '3', name: 'Bilibili', url: 'https://www.bilibili.com/', icon: '🎬', color: '#FB7299' },
                { id: '4', name: 'GitHub', url: 'https://www.github.com/', icon: '💻', color: '#24292E' },
                { id: '5', name: 'Cloudflare', url: 'https://dash.cloudflare.com/', icon: '☁️', color: '#F38020' },
                { id: '6', name: '豆包', url: 'https://www.doubao.com/', icon: '🫘', color: '#4F8CF7' },
                { id: '7', name: 'DeepSeek', url: 'https://www.deepseek.com/', icon: '🤖', color: '#4F8CF7' },
                { id: '8', name: '抖音', url: 'https://www.douyin.com/', icon: '🎵', color: '#1E1E1E' }
            ];

            const PRESET_ICONS = ['💬', '📁', '🎬', '💻', '☁️', '🫘', '🤖', '🎵', '🌐', '📧', '🛒', '📊', '🎮', '📷', '🎨', '🚀', '⚡',
                '🔥', '💡', '🎯', '📌', '🧠', '📱', '🖥️', '⌨️', '🕹️', '🎧', '📚', '🏠', '🔗'
            ];

            const DEFAULT_THREE_URLS = [
                'https://dash.cloudflare.com/',
                'https://www.github.com/',
                'https://chat.deepseek.com/'
            ];

            // ===== 预设背景 (使用免费图片占位) =====
            const PRESET_BGS = [
                { name: '深海', url: 'https://images.unsplash.com/photo-1541701494587-cb58502866ab?w=1200&q=80' },
                { name: '森林', url: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1200&q=80' },
                { name: '极光', url: 'https://images.unsplash.com/photo-1531366936337-7c912a4589a7?w=1200&q=80' },
                { name: '城市', url: 'https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=1200&q=80' },
                { name: '星空', url: 'https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=1200&q=80' },
                { name: '日落', url: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1200&q=80' },
            ];

            // ============================================================
            //  状态
            // ============================================================
            let sites = [];
            let editingId = null;
            let dragSrcIndex = null;

            // DOM
            const grid = document.getElementById('grid');
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            const addBtn = document.getElementById('addSiteBtn');
            const modalOverlay = document.getElementById('modalOverlay');
            const modalTitle = document.getElementById('modalTitle');
            const modalSub = document.getElementById('modalSub');
            const siteName = document.getElementById('siteName');
            const siteUrl = document.getElementById('siteUrl');
            const siteIcon = document.getElementById('siteIcon');
            const siteColor = document.getElementById('siteColor');
            const iconGrid = document.getElementById('iconGrid');
            const modalConfirm = document.getElementById('modalConfirm');
            const modalCancel = document.getElementById('modalCancel');
            const themeToggle = document.getElementById('themeToggle');
            const resetBtn = document.getElementById('resetBtn');
            const exportBtn = document.getElementById('exportBtn');
            const importBtn = document.getElementById('importBtn');
            const importFile = document.getElementById('importFile');
            const toastContainer = document.getElementById('toastContainer');

            // 三连开
            const threeBtn = document.getElementById('threeBtn');
            const configThreeBtn = document.getElementById('configThreeBtn');
            const threeModalOverlay = document.getElementById('threeModalOverlay');
            const threeUrl1 = document.getElementById('threeUrl1');
            const threeUrl2 = document.getElementById('threeUrl2');
            const threeUrl3 = document.getElementById('threeUrl3');
            const threeModalCancel = document.getElementById('threeModalCancel');
            const threeModalConfirm = document.getElementById('threeModalConfirm');

            // 背景
            const bgBtn = document.getElementById('bgBtn');
            const bgModalOverlay = document.getElementById('bgModalOverlay');
            const bgOptions = document.getElementById('bgOptions');
            const bgUpload = document.getElementById('bgUpload');
            const bgUrlInput = document.getElementById('bgUrlInput');
            const bgModalCancel = document.getElementById('bgModalCancel');
            const bgModalConfirm = document.getElementById('bgModalConfirm');
            const bgResetBtn = document.getElementById('bgResetBtn');

            // 时钟
            const hoursEl = document.getElementById('hours');
            const minutesEl = document.getElementById('minutes');
            const secondsEl = document.getElementById('seconds');
            const dateEl = document.getElementById('clockDate');

            // ============================================================
            //  工具
            // ============================================================
            function genId() {
                return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
            }

            function toast(msg, type = 'info') {
                const el = document.createElement('div');
                el.className = 'toast ' + type;
                const map = { success: '✅', error: '❌', warning: '⚠️', info: '💡' };
                el.innerHTML = `<span>${map[type] || '💡'}</span> ${msg}`;
                toastContainer.appendChild(el);
                setTimeout(() => {
                    el.style.opacity = '0';
                    el.style.transform = 'translateX(30px)';
                    el.style.transition = 'all 0.3s ease';
                    setTimeout(() => el.remove(), 400);
                }, 3500);
            }

            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/[&<>"]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    if (m === '"') return '&quot;';
                    return m;
                });
            }

            // ============================================================
            //  时钟
            // ============================================================
            function updateClock() {
                const now = new Date();
                const h = String(now.getHours()).padStart(2, '0');
                const m = String(now.getMinutes()).padStart(2, '0');
                const s = String(now.getSeconds()).padStart(2, '0');
                hoursEl.textContent = h;
                minutesEl.textContent = m;
                secondsEl.textContent = s;

                const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
                const y = now.getFullYear();
                const mo = String(now.getMonth() + 1).padStart(2, '0');
                const d = String(now.getDate()).padStart(2, '0');
                dateEl.textContent = `${y}年${mo}月${d}日 ${days[now.getDay()]}`;
            }
            setInterval(updateClock, 200);
            updateClock();

            // ============================================================
            //  数据持久化
            // ============================================================
            function loadData() {
                try {
                    const raw = localStorage.getItem('my_home_sites_v26');
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        if (Array.isArray(parsed) && parsed.length) {
                            sites = parsed;
                            return;
                        }
                    }
                } catch (_) {}
                sites = JSON.parse(JSON.stringify(DEFAULT_SITES));
            }

            function saveData() {
                localStorage.setItem('my_home_sites_v26', JSON.stringify(sites));
            }

            function getThreeUrls() {
                try {
                    const raw = localStorage.getItem('my_three_urls_v26');
                    if (raw) {
                        const arr = JSON.parse(raw);
                        if (Array.isArray(arr) && arr.length === 3) return arr;
                    }
                } catch (_) {}
                return [...DEFAULT_THREE_URLS];
            }

            function setThreeUrls(urls) {
                if (Array.isArray(urls) && urls.length === 3) {
                    localStorage.setItem('my_three_urls_v26', JSON.stringify(urls));
                }
            }

            // ============================================================
            //  背景管理
            // ============================================================
            function getBg() {
                try {
                    const raw = localStorage.getItem('my_bg_v26');
                    if (raw) return raw;
                } catch (_) {}
                return '';
            }

            function setBg(url) {
                if (url) {
                    localStorage.setItem('my_bg_v26', url);
                    document.body.style.setProperty('--bg-image', `url("${url}")`);
                } else {
                    localStorage.removeItem('my_bg_v26');
                    document.body.style.setProperty('--bg-image', 'none');
                }
            }

            function loadBg() {
                const url = getBg();
                if (url) {
                    document.body.style.setProperty('--bg-image', `url("${url}")`);
                } else {
                    document.body.style.setProperty('--bg-image', 'none');
                }
            }

            // 渲染背景预设
            function renderBgOptions() {
                bgOptions.innerHTML = '';
                PRESET_BGS.forEach((bg, idx) => {
                    const div = document.createElement('div');
                    div.className = 'bg-preset';
                    div.style.backgroundImage = `url("${bg.url}")`;
                    div.dataset.url = bg.url;
                    div.innerHTML = `<span class="bg-label">${bg.name}</span>`;
                    div.addEventListener('click', () => {
                        bgOptions.querySelectorAll('.bg-preset').forEach(el => el.classList.remove('active'));
                        div.classList.add('active');
                        bgUrlInput.value = bg.url;
                    });
                    bgOptions.appendChild(div);
                });
                // 高亮当前
                const current = getBg();
                if (current) {
                    bgOptions.querySelectorAll('.bg-preset').forEach(el => {
                        if (el.dataset.url === current) el.classList.add('active');
                    });
                    bgUrlInput.value = current;
                }
            }

            // ============================================================
            //  渲染网格
            // ============================================================
            function render() {
                if (!sites.length) {
                    grid.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">📭</div>
                            <p>还没有站点，点击「＋ 添加站点」创建一个吧</p>
                        </div>
                    `;
                    return;
                }

                let html = '';
                sites.forEach((site, index) => {
                    const color = site.color || '#6c8cff';
                    html += `
                        <div class="site-card" draggable="true" data-id="${site.id}" data-index="${index}">
                            <div class="color-bar" style="background:${color};"></div>
                            <span class="drag-handle">⠿</span>
                            <div class="card-icon">${site.icon || '🌐'}</div>
                            <div class="card-name">${escapeHtml(site.name)}</div>
                            <div class="card-url">${escapeHtml(site.url)}</div>
                            <div class="card-actions">
                                <button class="open-btn" data-url="${escapeHtml(site.url)}">打开</button>
                                <div class="card-tools">
                                    <button class="edit-btn" data-id="${site.id}" title="编辑">✏️</button>
                                    <button class="del-btn" data-id="${site.id}" title="删除">✕</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                grid.innerHTML = html;

                // 打开
                grid.querySelectorAll('.open-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const url = btn.dataset.url;
                        if (url) window.open(url, '_blank');
                    });
                });

                // 卡片点击
                grid.querySelectorAll('.site-card').forEach(card => {
                    card.addEventListener('click', (e) => {
                        if (e.target.closest('button')) return;
                        const url = card.querySelector('.open-btn')?.dataset.url;
                        if (url) window.open(url, '_blank');
                    });
                });

                // 删除
                grid.querySelectorAll('.del-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const id = btn.dataset.id;
                        if (confirm('确定要删除这个站点吗？')) {
                            sites = sites.filter(s => s.id !== id);
                            saveData();
                            render();
                            toast('已删除站点', 'success');
                        }
                    });
                });

                // 编辑
                grid.querySelectorAll('.edit-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const id = btn.dataset.id;
                        const site = sites.find(s => s.id === id);
                        if (site) openEditModal(site);
                    });
                });

                // 拖拽
                grid.querySelectorAll('.site-card').forEach(card => {
                    card.addEventListener('dragstart', onDragStart);
                    card.addEventListener('dragend', onDragEnd);
                    card.addEventListener('dragover', onDragOver);
                    card.addEventListener('drop', onDrop);
                    card.addEventListener('dragenter', onDragEnter);
                    card.addEventListener('dragleave', onDragLeave);
                });
            }

            // ============================================================
            //  拖拽
            // ============================================================
            function onDragStart(e) {
                const card = e.target.closest('.site-card');
                if (!card) return;
                dragSrcIndex = parseInt(card.dataset.index);
                card.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', card.dataset.id);
            }

            function onDragEnd(e) {
                const card = e.target.closest('.site-card');
                if (card) card.classList.remove('dragging');
                grid.querySelectorAll('.site-card').forEach(c => c.classList.remove('drag-over'));
                const placeholder = grid.querySelector('.drag-placeholder');
                if (placeholder) placeholder.remove();
            }

            function onDragOver(e) {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
            }

            function onDragEnter(e) {
                e.preventDefault();
                const card = e.target.closest('.site-card');
                if (card && card.dataset.index !== String(dragSrcIndex)) {
                    card.classList.add('drag-over');
                }
            }

            function onDragLeave(e) {
                const card = e.target.closest('.site-card');
                if (card) card.classList.remove('drag-over');
            }

            function onDrop(e) {
                e.preventDefault();
                const targetCard = e.target.closest('.site-card');
                if (!targetCard) return;
                const targetIndex = parseInt(targetCard.dataset.index);
                if (dragSrcIndex === null || dragSrcIndex === targetIndex) {
                    targetCard.classList.remove('drag-over');
                    return;
                }
                const [moved] = sites.splice(dragSrcIndex, 1);
                sites.splice(targetIndex, 0, moved);
                saveData();
                render();
                toast('排序已更新', 'success');
                dragSrcIndex = null;
                targetCard.classList.remove('drag-over');
            }

            // ============================================================
            //  模态框 (站点)
            // ============================================================
            function openModal(title, sub, data) {
                modalTitle.textContent = title;
                modalSub.textContent = sub;
                siteName.value = data?.name || '';
                siteUrl.value = data?.url || '';
                siteIcon.value = data?.icon || '';
                siteColor.value = data?.color || '#6c8cff';
                editingId = data?.id || null;
                iconGrid.querySelectorAll('button').forEach(btn => {
                    btn.classList.toggle('active', btn.textContent === siteIcon.value);
                });
                modalOverlay.classList.add('active');
                setTimeout(() => siteName.focus(), 100);
            }

            function closeModal() {
                modalOverlay.classList.remove('active');
                editingId = null;
            }

            function openAddModal() {
                openModal('添加站点', '输入站点信息，点击确认添加。', null);
            }

            function openEditModal(site) {
                openModal('编辑站点', '修改站点信息，点击确认保存。', site);
            }

            function renderIconGrid() {
                iconGrid.innerHTML = '';
                PRESET_ICONS.forEach(ic => {
                    const btn = document.createElement('button');
                    btn.textContent = ic;
                    btn.type = 'button';
                    btn.addEventListener('click', () => {
                        iconGrid.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        siteIcon.value = ic;
                    });
                    iconGrid.appendChild(btn);
                });
            }

            function handleModalConfirm() {
                const name = siteName.value.trim();
                const url = siteUrl.value.trim();
                const icon = siteIcon.value.trim() || '🌐';
                const color = siteColor.value || '#6c8cff';
                if (!name) { toast('请输入站点名称', 'warning');
                    siteName.focus(); return; }
                if (!url) { toast('请输入网址', 'warning');
                    siteUrl.focus(); return; }
                try { new URL(url); } catch (_) { toast('请输入有效的网址 (包含 http:// 或 https://)', 'warning');
                    siteUrl.focus(); return; }

                if (editingId) {
                    const idx = sites.findIndex(s => s.id === editingId);
                    if (idx !== -1) {
                        sites[idx] = { ...sites[idx], name, url, icon, color };
                        saveData();
                        render();
                        toast('站点已更新', 'success');
                    }
                } else {
                    sites.push({ id: genId(), name, url, icon, color });
                    saveData();
                    render();
                    toast('站点已添加', 'success');
                }
                closeModal();
            }

            // ============================================================
            //  三连开
            // ============================================================
            function openThreeSites() {
                const urls = getThreeUrls();
                let opened = 0;
                urls.forEach((url, idx) => {
                    try {
                        const win = window.open(url, `_three_${idx}_${Date.now()}`);
                        if (win) opened++;
                    } catch (_) {}
                });
                if (opened === 3) toast('已同时打开三个站点！', 'success');
                else if (opened > 0) toast(`打开了 ${opened} 个，部分可能被拦截`, 'warning');
                else toast('全部被拦截，请允许弹出窗口', 'error');
            }

            function openThreeConfig() {
                const urls = getThreeUrls();
                threeUrl1.value = urls[0] || '';
                threeUrl2.value = urls[1] || '';
                threeUrl3.value = urls[2] || '';
                threeModalOverlay.classList.add('active');
                setTimeout(() => threeUrl1.focus(), 100);
            }

            function closeThreeConfig() {
                threeModalOverlay.classList.remove('active');
            }

            function saveThreeConfig() {
                const u1 = threeUrl1.value.trim();
                const u2 = threeUrl2.value.trim();
                const u3 = threeUrl3.value.trim();
                if (!u1 || !u2 || !u3) { toast('请填写三个有效的网址', 'warning'); return; }
                try { new URL(u1);
                    new URL(u2);
                    new URL(u3); } catch (_) { toast('请确保所有网址格式正确 (包含 http:// 或 https://)',
                    'warning'); return; }
                setThreeUrls([u1, u2, u3]);
                closeThreeConfig();
                toast('三连开网址已更新', 'success');
            }

            // ============================================================
            //  搜索
            // ============================================================
            function doSearch() {
                const q = searchInput.value.trim();
                if (!q) { toast('请输入搜索关键词', 'warning'); return; }
                window.open(`https://www.bing.com/search?q=${encodeURIComponent(q)}`, '_blank');
            }

            // ============================================================
            //  导入 / 导出 / 重置
            // ============================================================
            function exportConfig() {
                const data = JSON.stringify(sites, null, 2);
                const blob = new Blob([data], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `起始页配置_${new Date().toISOString().slice(0,10)}.json`;
                a.click();
                URL.revokeObjectURL(a.href);
                toast('配置已导出', 'success');
            }

            function importConfig(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (Array.isArray(data) && data.length) {
                            if (confirm(`将导入 ${data.length} 个站点，覆盖当前所有数据，确定吗？`)) {
                                sites = data;
                                saveData();
                                render();
                                toast('配置导入成功！', 'success');
                            }
                        } else {
                            toast('无效的配置文件', 'error');
                        }
                    } catch (_) {
                        toast('解析配置文件失败', 'error');
                    }
                };
                reader.readAsText(file);
                importFile.value = '';
            }

            function resetToDefault() {
                if (confirm('重置将恢复默认站点列表，确定吗？')) {
                    sites = JSON.parse(JSON.stringify(DEFAULT_SITES));
                    saveData();
                    render();
                    toast('已重置为默认站点', 'success');
                }
            }

            // ============================================================
            //  主题
            // ============================================================
            function toggleTheme() {
                const current = document.documentElement.getAttribute('data-theme');
                const next = current === 'light' ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', next === 'light' ? 'light' : '');
                localStorage.setItem('my_home_theme_v26', next);
                themeToggle.textContent = next === 'light' ? '🌙' : '🌓';
                toast(`已切换到${next === 'light' ? '亮色' : '暗色'}主题`, 'info');
            }

            function loadTheme() {
                const saved = localStorage.getItem('my_home_theme_v26');
                if (saved === 'light') {
                    document.documentElement.setAttribute('data-theme', 'light');
                    themeToggle.textContent = '🌙';
                } else {
                    document.documentElement.removeAttribute('data-theme');
                    themeToggle.textContent = '🌓';
                }
            }

            // ============================================================
            //  背景模态框
            // ============================================================
            function openBgModal() {
                bgUrlInput.value = getBg();
                bgOptions.querySelectorAll('.bg-preset').forEach(el => {
                    el.classList.toggle('active', el.dataset.url === bgUrlInput.value);
                });
                bgModalOverlay.classList.add('active');
            }

            function closeBgModal() {
                bgModalOverlay.classList.remove('active');
            }

            function applyBg() {
                const url = bgUrlInput.value.trim();
                if (url) {
                    setBg(url);
                    toast('背景已更新', 'success');
                } else {
                    setBg('');
                    toast('已清除背景', 'info');
                }
                closeBgModal();
                // 刷新预设高亮
                renderBgOptions();
            }

            function resetBg() {
                setBg('');
                bgUrlInput.value = '';
                bgOptions.querySelectorAll('.bg-preset').forEach(el => el.classList.remove('active'));
                toast('已重置背景', 'info');
                closeBgModal();
                renderBgOptions();
            }

            // ============================================================
            //  键盘快捷键
            // ============================================================
            function handleKeydown(e) {
                if (e.ctrlKey && e.shiftKey && (e.key === 'a' || e.key === 'A')) {
                    e.preventDefault();
                    openAddModal();
                }
                if (e.key === 'Escape') {
                    if (modalOverlay.classList.contains('active')) closeModal();
                    if (threeModalOverlay.classList.contains('active')) closeThreeConfig();
                    if (bgModalOverlay.classList.contains('active')) closeBgModal();
                }
                if (e.target === searchInput && e.key === 'Enter') {
                    e.preventDefault();
                    doSearch();
                }
                if (e.ctrlKey && e.shiftKey && e.key === '3') {
                    e.preventDefault();
                    openThreeSites();
                }
            }

            // ============================================================
            //  初始化
            // ============================================================
            function init() {
                loadData();
                loadTheme();
                loadBg();
                renderIconGrid();
                renderBgOptions();
                render();

                // 搜索
                searchBtn.addEventListener('click', doSearch);
                searchInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') doSearch();
                });

                // 站点模态框
                addBtn.addEventListener('click', openAddModal);
                modalCancel.addEventListener('click', closeModal);
                modalConfirm.addEventListener('click', handleModalConfirm);
                modalOverlay.addEventListener('click', (e) => {
                    if (e.target === modalOverlay) closeModal();
                });

                // 主题
                themeToggle.addEventListener('click', toggleTheme);

                // 重置 / 导出 / 导入
                resetBtn.addEventListener('click', resetToDefault);
                exportBtn.addEventListener('click', exportConfig);
                importBtn.addEventListener('click', () => importFile.click());
                importFile.addEventListener('change', (e) => {
                    if (e.target.files.length) importConfig(e.target.files[0]);
                });

                // 三连开
                threeBtn.addEventListener('click', openThreeSites);
                configThreeBtn.addEventListener('click', openThreeConfig);
                threeModalCancel.addEventListener('click', closeThreeConfig);
                threeModalConfirm.addEventListener('click', saveThreeConfig);
                threeModalOverlay.addEventListener('click', (e) => {
                    if (e.target === threeModalOverlay) closeThreeConfig();
                });

                // 背景
                bgBtn.addEventListener('click', openBgModal);
                bgModalCancel.addEventListener('click', closeBgModal);
                bgModalConfirm.addEventListener('click', applyBg);
                bgResetBtn.addEventListener('click', resetBg);
                bgModalOverlay.addEventListener('click', (e) => {
                    if (e.target === bgModalOverlay) closeBgModal();
                });
                bgUpload.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (ev) => {
                            bgUrlInput.value = ev.target.result;
                            // 清除预设高亮
                            bgOptions.querySelectorAll('.bg-preset').forEach(el => el.classList.remove('active'));
                            toast('图片已加载，点击「应用」生效', 'info');
                        };
                        reader.readAsDataURL(file);
                    }
                });

                // 键盘
                document.addEventListener('keydown', handleKeydown);

                // 自动聚焦搜索
                setTimeout(() => searchInput.focus(), 400);

                console.log(`🚀 起始页 v${VERSION} 已加载，站点数:`, sites.length);
                console.log('🔗 三连开网址:', getThreeUrls());
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
