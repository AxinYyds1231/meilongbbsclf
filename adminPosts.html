<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帖子管理</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .app-wrapper { max-width: 1400px; }
        .post-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(4px);
            padding: 8px 14px;
            border-radius: 10px;
            margin-bottom: 6px;
            border: 1px solid rgba(255,255,255,0.4);
        }
        .post-item .info { flex: 1; }
        .post-item .title { font-weight: 500; color: #1a2332; }
        .post-item .meta { font-size: 0.8rem; color: #6b7a8a; }
        .post-item .actions button { margin-left: 4px; }
        .delete-btn {
            background: rgba(217,83,79,0.1);
            color: #d9534f;
            border: none;
            padding: 2px 12px;
            border-radius: 12px;
            cursor: pointer;
        }
        .delete-btn:hover { background: #d9534f; color: #fff; }
        .admin-menu a {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            margin: 0 8px;
            border-radius: 8px;
            color: #1a2332;
            text-decoration: none;
            gap: 8px;
        }
        .admin-menu a:hover { background: rgba(26,60,110,0.06); }
        .admin-menu a.active { background: rgba(26,60,110,0.1); color: #1a3c6e; font-weight:500; }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header"><h2>🔧 管理</h2></div>
            <nav class="sidebar-nav admin-menu">
                <a href="/adminDashboard.html">📊 仪表盘</a>
                <a href="/adminUsers.html">👥 用户管理</a>
                <a href="/adminPosts.html" class="active">📝 帖子管理</a>
                <a href="/adminCategories.html">📂 分类管理</a>
                <a href="/adminSensitive.html">🛡️ 敏感词</a>
                <a href="/adminAnnouncement.html">📢 公告</a>
            </nav>
            <div style="padding:16px; margin-top:auto; border-top:1px solid rgba(0,0,0,0.04);">
                <button onclick="location.href='/adminLogin.html'" class="btn-secondary btn-sm" style="width:100%;">🚪 退出管理</button>
            </div>
        </aside>

        <main class="main-content">
            <h1 class="page-title">📝 帖子管理</h1>
            <div id="postList">加载中...</div>
        </main>
    </div>

    <script>
        async function loadPosts() {
            try {
                const res = await fetch('/api/posts');
                const data = await res.json();
                const container = document.getElementById('postList');
                if (!data.posts || data.posts.length === 0) {
                    container.innerHTML = '<div style="color:#999; text-align:center; padding:20px;">暂无帖子</div>';
                    return;
                }
                let html = '';
                data.posts.forEach(p => {
                    const time = new Date(p.createdAt).toLocaleString('zh-CN');
                    html += `
                        <div class="post-item">
                            <div class="info">
                                <div class="title"><a href="/post.html?id=${p.id}" target="_blank">${p.title}</a></div>
                                <div class="meta">✍️ ${p.authorName} · 🕒 ${time} · 💬 ${p.replyCount}</div>
                            </div>
                            <div class="actions">
                                <button class="delete-btn" data-id="${p.id}">删除</button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;

                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = this.dataset.id;
                        const reason = prompt('请输入删除原因：');
                        if (reason && reason.trim()) {
                            const fd = new FormData();
                            fd.append('postId', id);
                            fd.append('reason', reason);
                            fetch('/api/adminDeletePostWithReason', { method: 'POST', credentials: 'include', body: fd })
                                .then(r => r.json())
                                .then(res => {
                                    if (res.success) { alert('已删除'); loadPosts(); }
                                    else alert(res.error);
                                });
                        }
                    });
                });
            } catch (err) {
                document.getElementById('postList').innerHTML = '<div style="color:red;">加载失败，请刷新</div>';
            }
        }
        loadPosts();
    </script>
</body>
</html>
