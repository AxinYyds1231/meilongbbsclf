<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帖子管理</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .post-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(4px);
            padding: 10px 16px;
            border-radius: 12px;
            margin-bottom: 8px;
            border: 1px solid rgba(255,255,255,0.5);
        }
        .post-item .info a { color: #1a2332; text-decoration: none; font-weight:500; }
        .post-item .info a:hover { text-decoration: underline; }
        .post-item .meta { font-size: 0.8rem; color: #6b7a8a; }
        .admin-menu a.active { background: rgba(26,60,110,0.1); color: #1a3c6e; font-weight:500; }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header"><h2>🔧 管理</h2></div>
            <nav class="sidebar-nav admin-menu">
                <a href="/adminDashboard.html">📊 仪表盘</a>
                <a href="/adminUsers.html">👥 用户管理</a>
                <a href="/adminPosts.html" class="active">📝 帖子管理</a>
                <a href="/adminCategories.html">📂 分类管理</a>
                <a href="/adminStats.html">📊 统计面板</a>
                <a href="/adminSensitive.html">🛡️ 敏感词</a>
                <a href="/adminAnnouncement.html">📢 公告</a>
            </nav>
            <div style="padding:16px; margin-top:auto; border-top:1px solid rgba(0,0,0,0.04);">
                <button onclick="logoutAdmin()" class="btn-secondary btn-sm" style="width:100%;">🚪 退出管理</button>
            </div>
        </aside>

        <main class="main-content">
            <h1 class="page-title">📝 帖子管理</h1>
            <div id="postList">加载中...</div>
            <a href="/adminDashboard.html" style="display:inline-block; margin-top:16px; color:#1a3c6e;">← 返回管理后台</a>
        </main>
    </div>

    <script>
        function logoutAdmin() {
            document.cookie = 'adminSession=; Path=/; Max-Age=0';
            window.location.href = '/adminLogin.html';
        }

        async function loadPosts() {
            try {
                const res = await fetch('/api/posts');
                const data = await res.json();
                const container = document.getElementById('postList');
                if (!data.posts || data.posts.length === 0) {
                    container.innerHTML = '<div style="color:#999; text-align:center; padding:20px;">暂无帖子</div>';
                    return;
                }
                let html = '';
                data.posts.forEach(p => {
                    html += `
                        <div class="post-item">
                            <div class="info">
                                <a href="/post.html?id=${p.id}">${p.title}</a>
                                <div class="meta">✍️ ${p.authorName} · 💬 ${p.replyCount}</div>
                            </div>
                            <button class="btn-sm btn-danger" onclick="deletePost(${p.id})">删除</button>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (err) {
                document.getElementById('postList').innerHTML = '<div style="color:red;">加载失败</div>';
            }
        }

        async function deletePost(id) {
            const reason = prompt('请输入删除原因：');
            if (!reason || !reason.trim()) return;
            const fd = new FormData();
            fd.append('postId', id);
            fd.append('reason', reason);
            try {
                const res = await fetch('/api/adminDeletePostWithReason', {
                    method: 'POST',
                    credentials: 'include',
                    body: fd
                });
                const result = await res.json();
                if (result.success) {
                    alert('已删除');
                    loadPosts();
                } else {
                    alert(result.error || '删除失败');
                }
            } catch (err) { alert('网络错误'); }
        }

        loadPosts();
    </script>
</body>
</html>
