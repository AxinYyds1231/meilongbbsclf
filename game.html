<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>跑酷小游戏 · 梅陇论坛</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    width:100%;height:100%;overflow:hidden;
    background:#e8ecf1;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:#1a2332;user-select:none;touch-action:manipulation;
    background-image:radial-gradient(circle at 20% 30%, rgba(26, 60, 110, 0.06), transparent 50%),
                     radial-gradient(circle at 80% 70%, rgba(26, 60, 110, 0.04), transparent 50%);
  }
  #wrap{
    position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;
    padding:20px;
  }
  #stage{
    position:relative;
    aspect-ratio: 960 / 600;
    width: min(100%, calc((100vh - 40px) * 1.6), 1200px);
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,0.10), 0 4px 12px rgba(0,0,0,0.05);
    border:1px solid rgba(255,255,255,0.6);
    background:#e8ecf1;
  }
  canvas{display:block;width:100%;height:100%;}

  /* 论坛风格遮罩 */
  .overlay{
    position:absolute;inset:0;z-index:5;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:1em;padding:2em 1.4em;overflow-y:auto;
    background:rgba(240,244,250,0.78);
    backdrop-filter:blur(14px) saturate(180%);
    -webkit-backdrop-filter:blur(14px) saturate(180%);
    animation:fadeIn .28s ease;
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .hidden{display:none!important;}

  .title{
    font-size:2.4em;font-weight:800;letter-spacing:.02em;line-height:1.2;
    background:linear-gradient(135deg,#1a3c6e,#2a5a8e);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-align:center;
  }
  .title.small{font-size:1.9em;}
  .sub{font-size:.85em;letter-spacing:.35em;color:#6b7a8a;opacity:.9;text-transform:uppercase;}

  .hint{
    font-size:.95em;color:#4a5a6a;text-align:center;line-height:1.9;
    background:rgba(255,255,255,0.55);
    padding:14px 24px;border-radius:16px;
    border:1px solid rgba(255,255,255,0.6);
    max-width:520px;
  }
  .hint b{color:#1a3c6e;font-weight:700;}

  .btn{
    font-family:inherit;font-size:1.05em;font-weight:600;letter-spacing:.02em;
    padding:.7em 2.4em;border-radius:30px;border:none;
    background:#1a3c6e;color:#fff;cursor:pointer;transition:.2s;
    box-shadow:0 2px 8px rgba(26,60,110,0.2);
  }
  .btn:hover{background:#2a5a8e;transform:translateY(-1px);box-shadow:0 4px 14px rgba(26,60,110,0.3);}
  .btn:active{transform:translateY(1px) scale(.98);}

  .btn.small{
    font-size:.9em;padding:.5em 1.6em;
    background:#1a3c6e;color:#fff;
  }
  .btn.small:hover{background:#2a5a8e;}

  .btn.ghost{
    background:rgba(0,0,0,0.05);color:#1a2332;
    border:1px solid rgba(0,0,0,0.06);
    box-shadow:none;font-size:.95em;padding:.55em 1.8em;
  }
  .btn.ghost:hover{background:rgba(0,0,0,0.09);transform:none;box-shadow:none;}

  .user-tag{
    font-size:.9em;color:#1a3c6e;letter-spacing:.02em;
    padding:.4em 1.1em;border-radius:1.2em;
    background:rgba(255,255,255,0.6);
    border:1px solid rgba(26,60,110,0.15);
    font-weight:500;
  }

  .score-big{
    font-size:3.2em;font-weight:900;line-height:1;
    color:#1a3c6e;
    font-variant-numeric:tabular-nums;
    text-shadow:0 4px 20px rgba(26,60,110,0.15);
  }
  .newrec{
    font-size:.9em;color:#b8860b;letter-spacing:.15em;font-weight:700;
    animation:pulse 1s infinite alternate;
  }
  @keyframes pulse{from{opacity:.55}to{opacity:1}}

  .board{
    width:min(26em,100%);margin-top:.5em;
    background:rgba(255,255,255,0.6);
    border:1px solid rgba(255,255,255,0.8);
    border-radius:16px;padding:1em 1.1em;
    box-shadow:0 4px 16px rgba(0,0,0,0.04);
  }
  .board-title{
    font-size:.88em;letter-spacing:.12em;color:#1a3c6e;
    margin-bottom:.7em;font-weight:700;
  }
  .lb{list-style:none;display:flex;flex-direction:column;gap:.3em;max-height:13em;overflow-y:auto;}
  .lb::-webkit-scrollbar{width:5px}
  .lb::-webkit-scrollbar-thumb{background:rgba(26,60,110,0.25);border-radius:3px}
  .lb-item{
    display:flex;align-items:center;gap:.6em;font-size:.92em;
    padding:.35em .6em;border-radius:10px;color:#4a5a6a;
    transition:background .15s;
  }
  .lb-item:hover{background:rgba(255,255,255,0.5);}
  .lb-item.me{
    background:linear-gradient(90deg,rgba(26,60,110,0.12),rgba(26,60,110,0.02));
    color:#1a3c6e;font-weight:500;
    box-shadow:inset 0 0 0 1px rgba(26,60,110,0.2);
  }
  .lb-rank{width:1.8em;text-align:center;flex:none;font-weight:700;color:#8b9aab;}
  .lb-item.me .lb-rank{color:#1a3c6e;}
  .lb-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lb-score{font-weight:800;font-variant-numeric:tabular-nums;color:#1a3c6e;}
  .lb-empty{font-size:.88rem;color:#8b9aab;text-align:center;padding:1em;list-style:none;}

  .save-row{display:flex;gap:.5em;align-items:center;margin-top:.2em;flex-wrap:wrap;justify-content:center;}

  .back-link{
    position:absolute;top:1em;left:1em;z-index:6;
    font-size:.92em;color:#1a3c6e;text-decoration:none;font-weight:500;
    padding:.45em 1.2em;border-radius:30px;
    background:rgba(255,255,255,0.8);
    backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,0.9);
    transition:.2s;
    box-shadow:0 2px 8px rgba(0,0,0,0.06);
  }
  .back-link:hover{background:#1a3c6e;color:#fff;border-color:#1a3c6e;}

  @media (max-width:640px){
    #wrap{padding:8px;}
    #stage{border-radius:16px; width: min(100%, calc((100vh - 16px) * 1.6));}
    .title{font-size:1.7em;}
    .title.small{font-size:1.4em;}
    .score-big{font-size:2.4em;}
    .hint{font-size:.82em;padding:10px 16px;}
    .btn{font-size:.92em;padding:.6em 1.8em;}
    .back-link{top:.6em;left:.6em;font-size:.8em;padding:.35em .9em;}
    .overlay{gap:.7em;padding:1.2em .9em;}
    .board{padding:.8em .9em;}
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="canvas"></canvas>

    <a href="/index.html" class="back-link">← 返回论坛</a>

    <!-- 主菜单 -->
    <div id="menu" class="overlay">
      <div class="title">跑酷小游戏</div>
      <div class="sub">MINI RUN</div>
      <div id="menuUserTag" class="user-tag hidden"></div>
      <div class="hint">
        <b>空格</b> / <b>↑</b> / <b>点击屏幕</b> 跳跃 · 空中可再跳一次<br>
        躲开红色障碍，跑得越远分越高
      </div>
      <button class="btn" id="btnStart">开 始 游 戏</button>
      <div class="board">
        <div class="board-title">🏆 排行榜 TOP 10</div>
        <ol class="lb" id="lbMenu"></ol>
      </div>
    </div>

    <!-- 结算 -->
    <div id="gameover" class="overlay hidden">
      <div class="title small">游戏结束</div>
      <div class="score-big" id="finalScore">0</div>
      <div class="sub" id="finalTip">SCORE</div>
      <div id="userLine" class="user-tag hidden"></div>
      <div class="save-row" id="saveRow">
        <button class="btn small" id="btnSave">保存成绩</button>
      </div>
      <button class="btn" id="btnRestart">再 来 一 局</button>
      <button class="btn ghost" id="btnMenu">返回首页</button>
      <div class="board">
        <div class="board-title">🏆 排行榜 TOP 5</div>
        <ol class="lb" id="lbOver"></ol>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   跑酷小游戏 （论坛浅色风格版）
   ============================================================ */

/* ---------- 常量 ---------- */
const W = 960, H = 600;
const GROUND_Y   = 480;
const GRAVITY    = 2400;
const JUMP_V     = -820;
const BASE_SPEED = 420;
const MAX_SPEED  = 950;
const FONT = '"PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';

/* ---------- DOM ---------- */
const stage     = document.getElementById('stage');
const cvs       = document.getElementById('canvas');
const ctx       = cvs.getContext('2d');
const menuEl    = document.getElementById('menu');
const overEl    = document.getElementById('gameover');
const lbMenuEl  = document.getElementById('lbMenu');
const lbOverEl  = document.getElementById('lbOver');
const finalScEl = document.getElementById('finalScore');
const finalTipEl= document.getElementById('finalTip');
const saveRow   = document.getElementById('saveRow');
const userLine  = document.getElementById('userLine');
const menuUserTag = document.getElementById('menuUserTag');

/* ---------- 当前用户 ---------- */
let currentUser = null;

async function fetchCurrentUser(){
  try{
    const res = await fetch('/api/user', { credentials: 'include' });
    if(res.status === 200){
      const data = await res.json();
      currentUser = data.user;
      menuUserTag.textContent = '👤 ' + currentUser.name;
      menuUserTag.classList.remove('hidden');
    }
  }catch(e){}
}

/* ---------- 自适应 ---------- */
const DPR = Math.min(window.devicePixelRatio || 1, 2);
function fit(){
  cvs.width  = Math.round(W * DPR);
  cvs.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const w = stage.clientWidth || 960;
  stage.style.fontSize = Math.max(11, w / 960 * 16) + 'px';
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', () => setTimeout(fit, 120));
fit();

/* ---------- 排行榜 ---------- */
const LB_KEY = 'minirun_lb_v1';

function getLB(){
  try{
    const raw = localStorage.getItem(LB_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}
function addScore(name, sc){
  const entry = { name, score: sc, date: Date.now() };
  const list = getLB();
  list.push(entry);
  list.sort((a,b)=> b.score - a.score || a.date - b.date);
  const trimmed = list.slice(0, 100);
  try{ localStorage.setItem(LB_KEY, JSON.stringify(trimmed)); }catch(e){}
  return { rank: trimmed.indexOf(entry) };
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function renderLB(el, limit, highlightRank){
  const list = getLB().slice(0, limit);
  if(!list.length){
    el.innerHTML = '<li class="lb-empty">还没有记录，快来成为第一名！</li>';
    return;
  }
  const medals = ['🥇','🥈','🥉'];
  el.innerHTML = list.map((it, i) => {
    const cls = (i === highlightRank) ? 'lb-item me' : 'lb-item';
    const rank = medals[i] || (i + 1);
    return `<li class="${cls}">
      <span class="lb-rank">${rank}</span>
      <span class="lb-name">${esc(it.name)}</span>
      <span class="lb-score">${it.score}</span>
    </li>`;
  }).join('');
}

/* ---------- 音效 ---------- */
let actx = null;
function initAudio(){
  if(actx) return;
  try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ actx = null; }
  if(actx && actx.state === 'suspended') actx.resume();
}
function beep(freq, dur, type, vol){
  if(!actx || actx.state !== 'running') return;
  try{
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, actx.currentTime);
    g.gain.setValueAtTime(vol || 0.05, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur + 0.02);
  }catch(e){}
}

/* ---------- 工具 ---------- */
function rr(c, x, y, w, h, r){
  r = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y,     x + w, y + h, r);
  c.arcTo(x + w, y + h, x,     y + h, r);
  c.arcTo(x,     y + h, x,     y,     r);
  c.arcTo(x,     y,     x + w, y,     r);
  c.closePath();
}
function rand(i){
  const x = Math.sin(i * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }

/* ---------- 云朵（浅色背景装饰） ---------- */
const clouds = [];
for(let i = 0; i < 5; i++){
  clouds.push({
    x: Math.random() * W,
    y: 60 + Math.random() * 220,
    scale: 0.7 + Math.random() * 0.8,
    speed: 0.06 + Math.random() * 0.14
  });
}

/* ---------- 游戏状态 ---------- */
let state = 'menu';
let player, obstacles, particles;
let speed, distance, score, spawnTimer, scroll, shake, time, submitted;

function resetGame(){
  player = {
    x: 150, y: GROUND_Y - 56, w: 34, h: 56,
    vy: 0, onGround: true, jumps: 0,
    sx: 1, sy: 1
  };
  obstacles  = [];
  particles  = [];
  speed      = BASE_SPEED;
  distance   = 0;
  score      = 0;
  spawnTimer = 1.0;
  scroll     = 0;
  shake      = 0;
  time       = 0;
  submitted  = false;
}

/* ---------- 粒子 ---------- */
function spawnDust(x, y, n, color, power){
  power = power || 1;
  for(let i = 0; i < n; i++){
    const life = 0.28 + Math.random() * 0.42;
    particles.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 240 * power - 70 * power,
      vy: -Math.random() * 230 * power - 30,
      life: life, life0: life,
      r: 1.8 + Math.random() * 3.2,
      color: color || '#4a7bb5',
      g: 950
    });
  }
}

/* ---------- 跳跃 ---------- */
function doJump(){
  if(state !== 'playing') return;
  if(player.jumps >= 2) return;

  player.vy = player.jumps === 0 ? JUMP_V : JUMP_V * 0.82;
  player.jumps++;
  player.onGround = false;

  player.sy = player.jumps === 1 ? 0.80 : 0.86;
  player.sx = 2 - player.sy;

  spawnDust(player.x + player.w/2, player.y + player.h, 7, '#4a7bb5', 0.8);
  beep(player.jumps === 1 ? 460 : 620, 0.09, 'square', 0.035);
}

/* ---------- 障碍物 ---------- */
function spawnObstacle(){
  const r = Math.random();
  let o;

  if(r < 0.55){
    const h = 34 + Math.random() * 24;
    const w = 34 + Math.random() * 22;
    o = { x: W + 40, y: GROUND_Y - h, w, h };
  } else if(r < 0.80){
    const h = 62 + Math.random() * 18;
    const w = 28 + Math.random() * 16;
    o = { x: W + 40, y: GROUND_Y - h, w, h };
  } else {
    const h = 28 + Math.random() * 16;
    const w = 78 + Math.random() * 44;
    o = { x: W + 40, y: GROUND_Y - h, w, h };
  }
  obstacles.push(o);
}

/* ---------- 碰撞 ---------- */
function hitTest(a, b){
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

/* ---------- 更新 ---------- */
function update(dt){
  time += dt;

  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.life -= dt;
    if(p.life <= 0){ particles.splice(i, 1); continue; }
    p.vy += p.g * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.985;
  }

  if(shake > 0) shake = Math.max(0, shake - dt * 55);

  if(player){
    const k = Math.min(1, dt * 13);
    player.sx += (1 - player.sx) * k;
    player.sy += (1 - player.sy) * k;
  }

  if(state === 'menu'){
    scroll += 80 * dt;
    return;
  }
  if(state !== 'playing') return;

  speed = Math.min(BASE_SPEED + distance * 0.025, MAX_SPEED);
  distance += speed * dt;
  score = Math.floor(distance / 10);
  scroll += speed * dt;

  player.vy += GRAVITY * dt;
  player.y  += player.vy * dt;

  const floorY = GROUND_Y - player.h;
  if(player.y >= floorY){
    if(!player.onGround && player.vy > 260){
      player.sy = 0.70; player.sx = 1.30;
      spawnDust(player.x + player.w/2, GROUND_Y, 9, '#4a7bb5', 1);
    }
    player.y = floorY;
    player.vy = 0;
    player.onGround = true;
    player.jumps = 0;
  } else {
    player.onGround = false;
  }

  for(let i = obstacles.length - 1; i >= 0; i--){
    const o = obstacles[i];
    o.x -= speed * dt;
    if(o.x + o.w < -80) obstacles.splice(i, 1);
  }

  spawnTimer -= dt;
  if(spawnTimer <= 0){
    spawnObstacle();
    const diff = Math.min(distance / 22000, 1);
    spawnTimer = (1.45 - 0.60 * diff) * (0.90 + Math.random() * 0.60);
  }

  const pb = {
    x: player.x + 6,
    y: player.y + 7,
    w: player.w - 12,
    h: player.h - 12
  };
  for(const o of obstacles){
    if(hitTest(pb, o)){ gameOver(); break; }
  }
}

/* ---------- 开始 / 结束 ---------- */
function startGame(){
  resetGame();
  state = 'playing';
  menuEl.classList.add('hidden');
  overEl.classList.add('hidden');
  initAudio();
  beep(660, 0.10, 'triangle', 0.045);
  setTimeout(() => beep(880, 0.12, 'triangle', 0.04), 90);
}

function gameOver(){
  state = 'gameover';
  shake = 16;
  spawnDust(player.x + player.w/2, player.y + player.h/2, 28, '#d9534f', 1.4);
  spawnDust(player.x + player.w/2, player.y + player.h/2, 16, '#4a7bb5', 1.1);
  beep(180, 0.30, 'sawtooth', 0.07);
  setTimeout(() => beep(110, 0.45, 'sawtooth', 0.06), 110);

  finalScEl.textContent = score;

  const lb = getLB();
  const isNew = !lb.length || score > lb[0].score;
  finalTipEl.textContent = isNew ? '★ 新纪录 ★' : 'SCORE';
  finalTipEl.style.color = isNew ? '#b8860b' : '#6b7a8a';

  if(currentUser){
    userLine.textContent = '👤 ' + currentUser.name;
    userLine.classList.remove('hidden');
    saveRow.classList.remove('hidden');
  } else {
    userLine.textContent = '未登录，无法保存成绩';
    userLine.style.color = '#d9534f';
    userLine.classList.remove('hidden');
    saveRow.classList.add('hidden');
  }

  renderLB(lbOverEl, 5, -1);

  setTimeout(() => {
    overEl.classList.remove('hidden');
  }, 420);
}

/* ---------- 渲染 ---------- */
function drawSky(){
  const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  g.addColorStop(0,    '#eef3fa');
  g.addColorStop(0.5,  '#dde7f3');
  g.addColorStop(1,    '#c8d6e8');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, GROUND_Y + 2);

  /* 柔和云朵 */
  const sOff = scroll * 0.02;
  for(const c of clouds){
    const x = ((c.x - sOff * c.speed * 40) % (W + 300) + W + 300) % (W + 300) - 150;
    const r = 40 * c.scale;
    const gr = ctx.createRadialGradient(x, c.y, r * 0.2, x, c.y, r);
    gr.addColorStop(0, 'rgba(255,255,255,0.85)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gr;
    ctx.beginPath();
    ctx.arc(x, c.y, r, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawCityLayer(parallax, gap, baseH, range, color, seed){
  const sc = scroll * parallax;
  const off = ((sc % gap) + gap) % gap;
  const startIdx = Math.floor(sc / gap);
  const count = Math.ceil(W / gap) + 3;

  for(let i = -1; i < count; i++){
    const idx = startIdx + i;
    const x = i * gap - off;
    if(x > W + 10 || x + gap < -10) continue;

    const r1 = rand(idx * 1.7 + seed);
    const r2 = rand(idx * 3.9 + seed * 1.3);
    const h = baseH + r1 * range;
    const w = gap * 0.50 + r2 * gap * 0.42;

    ctx.fillStyle = color;
    rr(ctx, x, GROUND_Y - h, w, h, 6);
    ctx.fill();

    /* 顶部高光 */
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillRect(x + 4, GROUND_Y - h + 4, w - 8, 2);

    /* 窗户 */
    if(parallax > 0.25 && r1 > 0.35){
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      const cols = Math.max(1, Math.floor(w / 16));
      const rows = Math.max(1, Math.floor(h / 24));
      for(let cx = 0; cx < cols; cx++){
        for(let cy = 0; cy < rows; cy++){
          if(rand(idx * 7 + cx * 13 + cy * 29) > 0.5){
            ctx.fillRect(x + 8 + cx * 16, GROUND_Y - h + 14 + cy * 24, 6, 8);
          }
        }
      }
    }
  }
}

function drawGround(){
  /* 地面底色（浅色） */
  const g = ctx.createLinearGradient(0, GROUND_Y, 0, H);
  g.addColorStop(0, '#d8e2ed');
  g.addColorStop(1, '#b8c4d4');
  ctx.fillStyle = g;
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);

  /* 地面透视线 */
  ctx.save();
  ctx.strokeStyle = 'rgba(26,60,110,0.08)';
  ctx.lineWidth = 1;
  const off = ((scroll * 1) % 110 + 110) % 110;
  for(let x = -220; x < W + 220; x += 110){
    const px = x - off;
    ctx.beginPath();
    ctx.moveTo(px, GROUND_Y);
    ctx.lineTo(px - 90, H);
    ctx.stroke();
  }
  for(let i = 1; i <= 3; i++){
    const y = GROUND_Y + i * 32;
    if(y > H) break;
    ctx.globalAlpha = 1 - i * 0.24;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  /* 蓝色地平线 */
  ctx.save();
  ctx.shadowColor = 'rgba(26,60,110,0.35)';
  ctx.shadowBlur = 12;
  ctx.strokeStyle = '#1a3c6e';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  ctx.lineTo(W, GROUND_Y);
  ctx.stroke();
  ctx.restore();

  /* 跑道虚线 */
  ctx.save();
  const dashOff = (scroll * 1.2) % 90;
  ctx.fillStyle = 'rgba(26,60,110,0.22)';
  for(let x = -90; x < W + 90; x += 90){
    ctx.fillRect(x - dashOff, GROUND_Y + 16, 44, 3);
  }
  ctx.restore();
}

function drawObstacles(){
  for(const o of obstacles){
    ctx.save();
    ctx.shadowColor = 'rgba(217,83,79,0.4)';
    ctx.shadowBlur = 14;

    const g = ctx.createLinearGradient(o.x, o.y, o.x, o.y + o.h);
    g.addColorStop(0,   '#f08b86');
    g.addColorStop(0.5, '#d9534f');
    g.addColorStop(1,   '#a83a36');
    ctx.fillStyle = g;
    rr(ctx, o.x, o.y, o.w, o.h, 8);
    ctx.fill();
    ctx.restore();

    /* 顶部高光 */
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    rr(ctx, o.x + 7, o.y + 7, Math.max(4, o.w - 14), 4, 2);
    ctx.fill();

    /* 底部阴影 */
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    rr(ctx, o.x + 7, o.y + o.h - 10, Math.max(4, o.w - 14), 5, 2);
    ctx.fill();
  }
}

function drawPlayer(){
  const cx = player.x + player.w / 2;
  const by = player.y + player.h;

  ctx.save();
  ctx.translate(cx, by);
  ctx.scale(player.sx, player.sy);
  ctx.translate(-player.w / 2, -player.h);

  const w = player.w, h = player.h;

  /* 外发光（蓝色） */
  ctx.save();
  ctx.shadowColor = 'rgba(26,60,110,0.4)';
  ctx.shadowBlur = 18;

  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0,   '#4a7bb5');
  g.addColorStop(0.5, '#2a5a8e');
  g.addColorStop(1,   '#1a3c6e');
  ctx.fillStyle = g;
  rr(ctx, 0, 0, w, h, 11);
  ctx.fill();
  ctx.restore();

  /* 顶部高光 */
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  rr(ctx, 5, 5, w - 10, 6, 3);
  ctx.fill();

  /* 眼睛（白色） */
  ctx.fillStyle = '#ffffff';
  const eyeY = h * 0.34;
  ctx.beginPath();
  ctx.arc(w * 0.32, eyeY, 3.5, 0, Math.PI * 2);
  ctx.arc(w * 0.70, eyeY, 3.5, 0, Math.PI * 2);
  ctx.fill();

  /* 瞳孔（深蓝） */
  ctx.fillStyle = '#0a1a2e';
  ctx.beginPath();
  ctx.arc(w * 0.33, eyeY, 1.6, 0, Math.PI * 2);
  ctx.arc(w * 0.71, eyeY, 1.6, 0, Math.PI * 2);
  ctx.fill();

  /* 嘴巴 */
  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(w * 0.36, h * 0.62);
  ctx.lineTo(w * 0.64, h * 0.62);
  ctx.stroke();

  ctx.restore();

  /* 落地时的地面光圈 */
  if(player.onGround){
    ctx.save();
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = '#4a7bb5';
    ctx.beginPath();
    ctx.ellipse(cx, GROUND_Y + 3, 24, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawParticles(){
  for(const p of particles){
    const a = clamp(p.life / p.life0, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * (0.4 + a * 0.6), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawHUD(){
  if(state === 'menu') return;

  ctx.save();
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';

  /* 分数（深蓝色） */
  ctx.font = `900 44px ${FONT}`;
  ctx.shadowColor = 'rgba(255,255,255,0.9)';
  ctx.shadowBlur = 8;
  ctx.fillStyle = '#1a3c6e';
  ctx.fillText(String(score).padStart(4, '0'), 34, 26);

  ctx.shadowBlur = 0;
  ctx.font = `700 14px ${FONT}`;
  ctx.fillStyle = 'rgba(26,60,110,0.55)';
  ctx.fillText('S C O R E', 37, 78);

  /* 速度条 */
  const pct = (speed - BASE_SPEED) / (MAX_SPEED - BASE_SPEED);
  ctx.fillStyle = 'rgba(26,60,110,0.12)';
  rr(ctx, 34, 104, 160, 6, 3);
  ctx.fill();
  const sg = ctx.createLinearGradient(34, 0, 194, 0);
  sg.addColorStop(0, '#4a7bb5');
  sg.addColorStop(1, '#1a3c6e');
  ctx.fillStyle = sg;
  rr(ctx, 34, 104, Math.max(6, 160 * pct), 6, 3);
  ctx.fill();

  ctx.restore();
}

function drawVignette(){
  /* 浅色背景下的柔和边角暗化 */
  const g = ctx.createRadialGradient(W/2, H/2, H*0.45, W/2, H/2, H*1.05);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(26,60,110,0.10)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function render(){
  let sx = 0, sy = 0;
  if(shake > 0){
    sx = (Math.random() - 0.5) * shake;
    sy = (Math.random() - 0.5) * shake;
  }
  ctx.setTransform(DPR, 0, 0, DPR, sx * DPR, sy * DPR);
  ctx.clearRect(-40, -40, W + 80, H + 80);

  drawSky();
  drawCityLayer(0.16, 100, 50, 110, '#d0dce8', 1.0);
  drawCityLayer(0.34, 130, 76, 170, '#bdcadb', 5.0);
  drawCityLayer(0.58, 170, 56, 120, '#a8b8ce', 9.0);

  drawGround();
  drawObstacles();
  if(player) drawPlayer();
  drawParticles();
  drawVignette();
  drawHUD();

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

/* ---------- 主循环 ---------- */
let lastTime = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if(dt > 0.05) dt = 0.05;
  if(dt < 0) dt = 0;

  update(dt);
  render();
}

/* ---------- 输入 ---------- */
function isTyping(e){
  return e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA');
}

window.addEventListener('keydown', e => {
  if(isTyping(e)) return;
  if(e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Enter'){
    e.preventDefault();
    if(state === 'playing') doJump();
    else if(state === 'menu') startGame();
  }
}, { passive: false });

cvs.addEventListener('pointerdown', e => {
  e.preventDefault();
  if(state === 'playing') doJump();
  else if(state === 'menu') startGame();
}, { passive: false });

cvs.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- 按钮绑定 ---------- */
document.getElementById('btnStart').addEventListener('click', startGame);

document.getElementById('btnRestart').addEventListener('click', () => {
  overEl.classList.add('hidden');
  startGame();
});

document.getElementById('btnMenu').addEventListener('click', () => {
  overEl.classList.add('hidden');
  menuEl.classList.remove('hidden');
  state = 'menu';
  resetGame();
  renderLB(lbMenuEl, 10, -1);
});

document.getElementById('btnSave').addEventListener('click', () => {
  if(submitted) return;
  if(!currentUser) return;
  submitted = true;

  const name = currentUser.name || '无名跑者';

  const { rank } = addScore(name, score);
  renderLB(lbOverEl, 5, rank < 5 ? rank : -1);

  saveRow.classList.add('hidden');
  beep(880, 0.10, 'triangle', 0.05);
  setTimeout(() => beep(1180, 0.14, 'triangle', 0.045), 100);
});

/* ---------- 初始化 ---------- */
resetGame();
renderLB(lbMenuEl, 10, -1);
fetchCurrentUser();
requestAnimationFrame(loop);
</script>
