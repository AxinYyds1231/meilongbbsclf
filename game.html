<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>跑酷小游戏 · 梅陇论坛</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    width:100%;height:100%;overflow:hidden;
    background:#e8ecf1;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:#1a2332;user-select:none;touch-action:manipulation;
    background-image:radial-gradient(circle at 20% 30%, rgba(26, 60, 110, 0.06), transparent 50%),
                     radial-gradient(circle at 80% 70%, rgba(26, 60, 110, 0.04), transparent 50%);
  }
  #wrap{
    position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;
    padding:20px;
  }
  #stage{
    position:relative;
    aspect-ratio: 960 / 600;
    width: min(100%, calc((100vh - 40px) * 1.6), 1200px);
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,0.10), 0 4px 12px rgba(0,0,0,0.05);
    border:1px solid rgba(255,255,255,0.6);
    background:#e8ecf1;
  }
  canvas{display:block;width:100%;height:100%;}

  /* ---------- HUD（右上角分数） ---------- */
  .hud{
    position:absolute;
    top:14px;
    right:20px;
    z-index:4;
    text-align:right;
    pointer-events:none;
    transition:opacity .2s;
  }
  .hud-mode{
    font-size:.78rem;
    color:rgba(26,60,110,0.55);
    letter-spacing:.06em;
    margin-bottom:2px;
    font-weight:500;
  }
  .hud-score-label{
    font-size:.65rem;
    color:rgba(26,60,110,0.45);
    letter-spacing:.25em;
    font-weight:700;
  }
  .hud-score{
    font-size:2.2rem;
    font-weight:900;
    color:#1a3c6e;
    line-height:1;
    font-variant-numeric:tabular-nums;
    text-shadow:0 2px 10px rgba(255,255,255,0.9);
  }
  .hud-progress-wrap{margin-top:6px;}
  .hud-progress-bar{
    width:130px;
    height:5px;
    background:rgba(26,60,110,0.12);
    border-radius:3px;
    overflow:hidden;
    margin-left:auto;
  }
  .hud-progress-fill{
    height:100%;
    background:linear-gradient(90deg, #4a7bb5, #1a3c6e);
    border-radius:3px;
    transition:width .18s;
    width:0%;
  }
  .hud-progress-text{
    font-size:.7rem;
    color:rgba(26,60,110,0.55);
    margin-top:3px;
    font-variant-numeric:tabular-nums;
  }

  /* ---------- 遮罩 ---------- */
  .overlay{
    position:absolute;inset:0;z-index:5;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:.8em;padding:1.6em 1.2em;overflow-y:auto;
    background:rgba(240,244,250,0.80);
    backdrop-filter:blur(14px) saturate(180%);
    -webkit-backdrop-filter:blur(14px) saturate(180%);
    animation:fadeIn .28s ease;
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .hidden{display:none!important;}

  .title{
    font-size:2.2em;font-weight:800;letter-spacing:.02em;line-height:1.2;
    background:linear-gradient(135deg,#1a3c6e,#2a5a8e);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-align:center;
  }
  .title.small{font-size:1.8em;}
  .sub{font-size:.8em;letter-spacing:.35em;color:#6b7a8a;opacity:.9;text-transform:uppercase;}

  .hint{
    font-size:.85em;color:#4a5a6a;text-align:center;line-height:1.7;
    background:rgba(255,255,255,0.55);
    padding:10px 20px;border-radius:14px;
    border:1px solid rgba(255,255,255,0.6);
    max-width:480px;
  }
  .hint b{color:#1a3c6e;font-weight:700;}

  .btn{
    font-family:inherit;font-size:1em;font-weight:600;letter-spacing:.02em;
    padding:.65em 2.2em;border-radius:30px;border:none;
    background:#1a3c6e;color:#fff;cursor:pointer;transition:.2s;
    box-shadow:0 2px 8px rgba(26,60,110,0.2);
  }
  .btn:hover{background:#2a5a8e;transform:translateY(-1px);box-shadow:0 4px 14px rgba(26,60,110,0.3);}
  .btn:active{transform:translateY(1px) scale(.98);}
  .btn.small{font-size:.88em;padding:.5em 1.5em;}
  .btn.ghost{
    background:rgba(0,0,0,0.05);color:#1a2332;
    border:1px solid rgba(0,0,0,0.06);
    box-shadow:none;font-size:.9em;padding:.5em 1.6em;
  }
  .btn.ghost:hover{background:rgba(0,0,0,0.09);transform:none;box-shadow:none;}

  .user-tag{
    font-size:.88em;color:#1a3c6e;
    padding:.35em 1em;border-radius:1.2em;
    background:rgba(255,255,255,0.6);
    border:1px solid rgba(26,60,110,0.15);
    font-weight:500;
  }

  /* ---------- 模式网格 ---------- */
  .mode-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:10px;
    width:min(560px, 100%);
    margin-top:4px;
  }
  .mode-card{
    background:rgba(255,255,255,0.72);
    border:1px solid rgba(255,255,255,0.9);
    border-radius:14px;
    padding:12px 14px;
    text-align:left;
    cursor:pointer;
    font-family:inherit;
    color:#1a2332;
    transition:.18s;
    box-shadow:0 2px 8px rgba(0,0,0,0.04);
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .mode-card:hover:not(.locked){
    background:#fff;
    transform:translateY(-2px);
    box-shadow:0 6px 18px rgba(0,0,0,0.09);
  }
  .mode-card.locked{
    opacity:0.5;
    cursor:not-allowed;
    filter:grayscale(0.6);
  }
  .mode-card[data-mode="endless"]{
    grid-column:span 2;
    background:linear-gradient(135deg, rgba(26,60,110,0.10), rgba(74,123,181,0.05));
  }
  .mode-icon{font-size:1.3em;}
  .mode-name{font-size:.98em;font-weight:700;color:#1a3c6e;}
  .mode-desc{font-size:.78em;color:#6b7a8a;}
  .mode-status{
    font-size:.78em;color:#2a5a8e;font-weight:600;margin-top:2px;
  }
  .mode-card.locked .mode-status{color:#8b9aab;}
  .mode-best{font-size:.75em;color:#8b9aab;}

  /* ---------- 结算 ---------- */
  .score-big{
    font-size:3em;font-weight:900;line-height:1;
    color:#1a3c6e;
    font-variant-numeric:tabular-nums;
    text-shadow:0 4px 20px rgba(26,60,110,0.15);
  }
  .save-row{display:flex;gap:.5em;align-items:center;flex-wrap:wrap;justify-content:center;}
  .btn-row{display:flex;gap:.6em;flex-wrap:wrap;justify-content:center;}

  .board{
    width:min(24em,100%);
    background:rgba(255,255,255,0.6);
    border:1px solid rgba(255,255,255,0.8);
    border-radius:16px;padding:.9em 1em;
    box-shadow:0 4px 16px rgba(0,0,0,0.04);
  }
  .board-title{
    font-size:.85em;letter-spacing:.1em;color:#1a3c6e;
    margin-bottom:.6em;font-weight:700;
  }
  .lb{list-style:none;display:flex;flex-direction:column;gap:.28em;max-height:12em;overflow-y:auto;}
  .lb::-webkit-scrollbar{width:5px}
  .lb::-webkit-scrollbar-thumb{background:rgba(26,60,110,0.25);border-radius:3px}
  .lb-item{
    display:flex;align-items:center;gap:.6em;font-size:.9em;
    padding:.32em .55em;border-radius:10px;color:#4a5a6a;
  }
  .lb-item.me{
    background:linear-gradient(90deg,rgba(26,60,110,0.12),rgba(26,60,110,0.02));
    color:#1a3c6e;font-weight:500;
    box-shadow:inset 0 0 0 1px rgba(26,60,110,0.2);
  }
  .lb-rank{width:1.8em;text-align:center;flex:none;font-weight:700;color:#8b9aab;}
  .lb-item.me .lb-rank{color:#1a3c6e;}
  .lb-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lb-score{font-weight:800;font-variant-numeric:tabular-nums;color:#1a3c6e;}
  .lb-empty{font-size:.85rem;color:#8b9aab;text-align:center;padding:1em;list-style:none;}

  .back-link{
    position:absolute;top:1em;left:1em;z-index:6;
    font-size:.88em;color:#1a3c6e;text-decoration:none;font-weight:500;
    padding:.42em 1.1em;border-radius:30px;
    background:rgba(255,255,255,0.8);
    backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,0.9);
    transition:.2s;
    box-shadow:0 2px 8px rgba(0,0,0,0.06);
  }
  .back-link:hover{background:#1a3c6e;color:#fff;border-color:#1a3c6e;}

  @media (max-width:640px){
    #wrap{padding:8px;}
    #stage{border-radius:16px;}
    .title{font-size:1.6em;}
    .title.small{font-size:1.3em;}
    .score-big{font-size:2.2em;}
    .hint{font-size:.78em;padding:8px 14px;}
    .btn{font-size:.9em;padding:.55em 1.6em;}
    .back-link{top:.6em;left:.6em;font-size:.78em;padding:.3em .8em;}
    .overlay{gap:.6em;padding:1em .9em;}
    .hud-score{font-size:1.6rem;}
    .hud-progress-bar{width:90px;}
    .mode-grid{grid-template-columns:1fr;gap:8px;}
    .mode-card[data-mode="endless"]{grid-column:span 1;}
    .board{padding:.7em .8em;}
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="canvas"></canvas>

    <a href="/index.html" class="back-link">← 返回论坛</a>

    <!-- HUD（右上角） -->
    <div id="hud" class="hud hidden">
      <div class="hud-mode" id="hudMode">无尽模式</div>
      <div class="hud-score-label">SCORE</div>
      <div class="hud-score" id="hudScore">0000</div>
      <div class="hud-progress-wrap" id="hudProgressWrap" style="display:none;">
        <div class="hud-progress-bar"><div class="hud-progress-fill" id="hudProgressFill"></div></div>
        <div class="hud-progress-text" id="hudProgressText">0 / 0</div>
      </div>
    </div>

    <!-- 主菜单 -->
    <div id="menu" class="overlay">
      <div class="title">跑酷小游戏</div>
      <div class="sub">MINI RUN</div>
      <div id="menuUserTag" class="user-tag hidden"></div>
      <div class="hint">
        <b>空格</b> / <b>↑</b> / <b>点击屏幕</b> 跳跃 · 空中可再跳一次
      </div>
      <div class="mode-grid" id="modeGrid"></div>
      <div class="board" style="margin-top:6px;">
        <div class="board-title">🏆 无尽模式排行榜 TOP 5</div>
        <ol class="lb" id="lbMenu"></ol>
      </div>
    </div>

    <!-- 结算 -->
    <div id="gameover" class="overlay hidden">
      <div class="title small" id="overTitle">游戏结束</div>
      <div class="score-big" id="finalScore">0</div>
      <div class="sub" id="finalTip">SCORE</div>
      <div id="userLine" class="user-tag hidden"></div>
      <div class="save-row" id="saveRow">
        <button class="btn small" id="btnSave">保存成绩</button>
      </div>
      <div class="btn-row">
        <button class="btn" id="btnRestart">再 来 一 局</button>
        <button class="btn small" id="btnNext" style="display:none;">下 一 关</button>
      </div>
      <button class="btn ghost" id="btnMenu">返回菜单</button>
      <div class="board" id="overBoard">
        <div class="board-title">🏆 排行榜 TOP 5</div>
        <ol class="lb" id="lbOver"></ol>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   跑酷小游戏 · 关卡 + 无尽模式
   ============================================================ */

/* ---------- 画布尺寸 ---------- */
const W = 960, H = 600;
const GROUND_Y   = 480;
const GRAVITY    = 2400;
const JUMP_V     = -820;
const FONT = '"PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';

/* ---------- 关卡配置 ---------- */
const LEVELS = {
  endless: {
    id: 'endless',
    name: '无尽模式',
    icon: '♾️',
    desc: '挑战极限，越远越好',
    target: 0,
    baseSpeed: 420,
    maxSpeed: 950,
    spawnBase: 1.45,
    spawnDiff: 0.60
  },
  level1: {
    id: 'level1',
    name: '第 1 关 · 新手村',
    icon: '🌱',
    desc: '轻松起步，熟悉操作',
    target: 500,
    baseSpeed: 340,
    maxSpeed: 520,
    spawnBase: 1.95,
    spawnDiff: 0.30
  },
  level2: {
    id: 'level2',
    name: '第 2 关 · 进阶之路',
    icon: '🌿',
    desc: '渐入佳境',
    target: 1200,
    baseSpeed: 380,
    maxSpeed: 640,
    spawnBase: 1.65,
    spawnDiff: 0.45
  },
  level3: {
    id: 'level3',
    name: '第 3 关 · 疾风挑战',
    icon: '🔥',
    desc: '速度与激情',
    target: 2200,
    baseSpeed: 440,
    maxSpeed: 780,
    spawnBase: 1.35,
    spawnDiff: 0.55
  },
  level4: {
    id: 'level4',
    name: '第 4 关 · 极限冲刺',
    icon: '⚡',
    desc: '只有强者能通过',
    target: 3500,
    baseSpeed: 500,
    maxSpeed: 900,
    spawnBase: 1.10,
    spawnDiff: 0.65
  }
};
const LEVEL_ORDER = ['level1', 'level2', 'level3', 'level4'];

/* ---------- DOM ---------- */
const stage     = document.getElementById('stage');
const cvs       = document.getElementById('canvas');
const ctx       = cvs.getContext('2d');
const menuEl    = document.getElementById('menu');
const overEl    = document.getElementById('gameover');
const hudEl     = document.getElementById('hud');
const lbMenuEl  = document.getElementById('lbMenu');
const lbOverEl  = document.getElementById('lbOver');
const finalScEl = document.getElementById('finalScore');
const finalTipEl= document.getElementById('finalTip');
const saveRow   = document.getElementById('saveRow');
const userLine  = document.getElementById('userLine');
const menuUserTag = document.getElementById('menuUserTag');
const modeGridEl = document.getElementById('modeGrid');

/* ---------- 当前用户 ---------- */
let currentUser = null;

async function fetchCurrentUser(){
  try{
    const res = await fetch('/api/user', { credentials: 'include' });
    if(res.status === 200){
      const data = await res.json();
      currentUser = data.user;
      menuUserTag.textContent = '👤 ' + currentUser.name;
      menuUserTag.classList.remove('hidden');
    }
  }catch(e){}
}

/* ---------- 自适应 ---------- */
const DPR = Math.min(window.devicePixelRatio || 1, 2);
function fit(){
  cvs.width  = Math.round(W * DPR);
  cvs.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const w = stage.clientWidth || 960;
  stage.style.fontSize = Math.max(11, w / 960 * 16) + 'px';
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', () => setTimeout(fit, 120));
fit();

/* ---------- 排行榜（无尽模式） ---------- */
const LB_KEY = 'minirun_lb_v1';

function getLB(){
  try{
    const raw = localStorage.getItem(LB_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}
function addScore(name, sc){
  const entry = { name, score: sc, date: Date.now() };
  const list = getLB();
  list.push(entry);
  list.sort((a,b)=> b.score - a.score || a.date - b.date);
  const trimmed = list.slice(0, 100);
  try{ localStorage.setItem(LB_KEY, JSON.stringify(trimmed)); }catch(e){}
  return { rank: trimmed.indexOf(entry) };
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function renderLB(el, limit, highlightRank){
  const list = getLB().slice(0, limit);
  if(!list.length){
    el.innerHTML = '<li class="lb-empty">还没有记录，快来成为第一名！</li>';
    return;
  }
  const medals = ['🥇','🥈','🥉'];
  el.innerHTML = list.map((it, i) => {
    const cls = (i === highlightRank) ? 'lb-item me' : 'lb-item';
    const rank = medals[i] || (i + 1);
    return `<li class="${cls}">
      <span class="lb-rank">${rank}</span>
      <span class="lb-name">${esc(it.name)}</span>
      <span class="lb-score">${it.score}</span>
    </li>`;
  }).join('');
}

/* ---------- 关卡进度 ---------- */
const PROG_KEY = 'minirun_progress_v1';

function getProgress(){
  try{
    const raw = localStorage.getItem(PROG_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveProgress(p){
  try{ localStorage.setItem(PROG_KEY, JSON.stringify(p)); }catch(e){}
}
function setLevelResult(levelId, score, cleared){
  const p = getProgress();
  const cur = p[levelId] || { best: 0, cleared: false };
  p[levelId] = {
    best: Math.max(cur.best, score),
    cleared: cur.cleared || cleared
  };
  saveProgress(p);
}
function isLevelUnlocked(levelId){
  if(levelId === 'endless' || levelId === 'level1') return true;
  const idx = LEVEL_ORDER.indexOf(levelId);
  if(idx <= 0) return true;
  const prev = LEVEL_ORDER[idx - 1];
  const p = getProgress();
  return p[prev] && p[prev].cleared;
}

/* ---------- 渲染模式网格 ---------- */
function renderModeGrid(){
  const progress = getProgress();
  const lb = getLB();
  const bestEndless = lb.length ? lb[0].score : 0;

  let html = `
    <button class="mode-card" data-mode="endless">
      <div class="mode-icon">♾️</div>
      <div class="mode-name">无尽模式</div>
      <div class="mode-desc">挑战极限，越远越好</div>
      <div class="mode-status">${bestEndless > 0 ? '最佳：' + bestEndless + ' 分' : '还没有记录'}</div>
    </button>
  `;

  LEVEL_ORDER.forEach(id => {
    const lv = LEVELS[id];
    const unlocked = isLevelUnlocked(id);
    const prog = progress[id] || { best: 0, cleared: false };
    let status;
    if(!unlocked){
      status = '🔒 未解锁';
    } else if(prog.cleared){
      status = '✅ 已通关';
    } else {
      status = `🎯 目标 ${lv.target} 分`;
    }
    const bestText = (unlocked && prog.best > 0) ? `最佳：${prog.best} 分` : '';

    html += `
      <button class="mode-card ${unlocked ? '' : 'locked'}" data-mode="${id}" ${unlocked ? '' : 'disabled'}>
        <div class="mode-icon">${lv.icon}</div>
        <div class="mode-name">${lv.name}</div>
        <div class="mode-desc">${lv.desc}</div>
        <div class="mode-status">${status}</div>
        ${bestText ? `<div class="mode-best">${bestText}</div>` : ''}
      </button>
    `;
  });

  modeGridEl.innerHTML = html;

  modeGridEl.querySelectorAll('.mode-card').forEach(card => {
    card.addEventListener('click', () => {
      const mode = card.dataset.mode;
      if(!isLevelUnlocked(mode)) return;
      startGame(mode);
    });
  });
}

/* ---------- 音效 ---------- */
let actx = null;
function initAudio(){
  if(actx) return;
  try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ actx = null; }
  if(actx && actx.state === 'suspended') actx.resume();
}
function beep(freq, dur, type, vol){
  if(!actx || actx.state !== 'running') return;
  try{
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, actx.currentTime);
    g.gain.setValueAtTime(vol || 0.05, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur + 0.02);
  }catch(e){}
}

/* ---------- 工具 ---------- */
function rr(c, x, y, w, h, r){
  r = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y,     x + w, y + h, r);
  c.arcTo(x + w, y + h, x,     y + h, r);
  c.arcTo(x,     y + h, x,     y,     r);
  c.arcTo(x,     y,     x + w, y,     r);
  c.closePath();
}
function rand(i){
  const x = Math.sin(i * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }

/* ---------- 云朵 ---------- */
const clouds = [];
for(let i = 0; i < 5; i++){
  clouds.push({
    x: Math.random() * W,
    y: 60 + Math.random() * 220,
    scale: 0.7 + Math.random() * 0.8,
    speed: 0.06 + Math.random() * 0.14
  });
}

/* ---------- 游戏状态 ---------- */
let state = 'menu';
let player, obstacles, particles;
let currentLevel = LEVELS.endless;
let speed, distance, score, spawnTimer, scroll, shake, time, submitted;
let lastHudScore = -1;

function resetGame(){
  player = {
    x: 150, y: GROUND_Y - 56, w: 34, h: 56,
    vy: 0, onGround: true, jumps: 0,
    sx: 1, sy: 1
  };
  obstacles  = [];
  particles  = [];
  speed      = currentLevel.baseSpeed;
  distance   = 0;
  score      = 0;
  spawnTimer = 1.0;
  scroll     = 0;
  shake      = 0;
  time       = 0;
  submitted  = false;
  lastHudScore = -1;
}

/* ---------- 粒子 ---------- */
function spawnDust(x, y, n, color, power){
  power = power || 1;
  for(let i = 0; i < n; i++){
    const life = 0.28 + Math.random() * 0.42;
    particles.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 240 * power - 70 * power,
      vy: -Math.random() * 230 * power - 30,
      life: life, life0: life,
      r: 1.8 + Math.random() * 3.2,
      color: color || '#4a7bb5',
      g: 950
    });
  }
}

/* ---------- 跳跃 ---------- */
function doJump(){
  if(state !== 'playing') return;
  if(player.jumps >= 2) return;

  player.vy = player.jumps === 0 ? JUMP_V : JUMP_V * 0.82;
  player.jumps++;
  player.onGround = false;

  player.sy = player.jumps === 1 ? 0.80 : 0.86;
  player.sx = 2 - player.sy;

  spawnDust(player.x + player.w/2, player.y + player.h, 7, '#4a7bb5', 0.8);
  beep(player.jumps === 1 ? 460 : 620, 0.09, 'square', 0.035);
}

/* ---------- 障碍物 ---------- */
function spawnObstacle(){
  const r = Math.random();
  let o;

  if(r < 0.55){
    const h = 34 + Math.random() * 24;
    const w = 34 + Math.random() * 22;
    o = { x: W + 40, y: GROUND_Y - h, w, h };
  } else if(r < 0.80){
    const h = 62 + Math.random() * 18;
    const w = 28 + Math.random() * 16;
    o = { x: W + 40, y: GROUND_Y - h, w, h };
  } else {
    const h = 28 + Math.random() * 16;
    const w = 78 + Math.random() * 44;
    o = { x: W + 40, y: GROUND_Y - h, w, h };
  }
  obstacles.push(o);
}

/* ---------- 碰撞 ---------- */
function hitTest(a, b){
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

/* ---------- 更新 ---------- */
function update(dt){
  time += dt;

  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.life -= dt;
    if(p.life <= 0){ particles.splice(i, 1); continue; }
    p.vy += p.g * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.985;
  }

  if(shake > 0) shake = Math.max(0, shake - dt * 55);

  if(player){
    const k = Math.min(1, dt * 13);
    player.sx += (1 - player.sx) * k;
    player.sy += (1 - player.sy) * k;
  }

  if(state === 'menu'){
    scroll += 80 * dt;
    return;
  }
  if(state !== 'playing') return;

  speed = Math.min(currentLevel.baseSpeed + distance * 0.025, currentLevel.maxSpeed);
  distance += speed * dt;
  score = Math.floor(distance / 10);
  scroll += speed * dt;

  player.vy += GRAVITY * dt;
  player.y  += player.vy * dt;

  const floorY = GROUND_Y - player.h;
  if(player.y >= floorY){
    if(!player.onGround && player.vy > 260){
      player.sy = 0.70; player.sx = 1.30;
      spawnDust(player.x + player.w/2, GROUND_Y, 9, '#4a7bb5', 1);
    }
    player.y = floorY;
    player.vy = 0;
    player.onGround = true;
    player.jumps = 0;
  } else {
    player.onGround = false;
  }

  for(let i = obstacles.length - 1; i >= 0; i--){
    const o = obstacles[i];
    o.x -= speed * dt;
    if(o.x + o.w < -80) obstacles.splice(i, 1);
  }

  spawnTimer -= dt;
  if(spawnTimer <= 0){
    spawnObstacle();
    const diff = Math.min(distance / 22000, 1);
    spawnTimer = (currentLevel.spawnBase - currentLevel.spawnDiff * diff) * (0.90 + Math.random() * 0.60);
  }

  updateHud();

  /* 通关判断（关卡模式） */
  if(currentLevel.target > 0 && score >= currentLevel.target){
    gameOver('clear');
    return;
  }

  /* 碰撞判断 */
  const pb = {
    x: player.x + 6,
    y: player.y + 7,
    w: player.w - 12,
    h: player.h - 12
  };
  for(const o of obstacles){
    if(hitTest(pb, o)){ gameOver('fail'); break; }
  }
}

/* ---------- HUD 更新 ---------- */
function updateHud(){
  if(score === lastHudScore) return;
  lastHudScore = score;

  document.getElementById('hudScore').textContent = String(score).padStart(4, '0');

  if(currentLevel.target > 0){
    const pct = Math.min(100, score / currentLevel.target * 100);
    document.getElementById('hudProgressFill').style.width = pct + '%';
    document.getElementById('hudProgressText').textContent = `${score} / ${currentLevel.target}`;
  }
}

/* ---------- 开始 / 结束 ---------- */
function startGame(levelId){
  if(levelId && LEVELS[levelId]){
    currentLevel = LEVELS[levelId];
  }
  resetGame();
  state = 'playing';
  menuEl.classList.add('hidden');
  overEl.classList.add('hidden');
  hudEl.classList.remove('hidden');

  /* 设置 HUD */
  document.getElementById('hudMode').textContent = currentLevel.name;
  document.getElementById('hudScore').textContent = '0000';
  const progWrap = document.getElementById('hudProgressWrap');
  if(currentLevel.target > 0){
    progWrap.style.display = 'block';
    document.getElementById('hudProgressFill').style.width = '0%';
    document.getElementById('hudProgressText').textContent = `0 / ${currentLevel.target}`;
  } else {
    progWrap.style.display = 'none';
  }

  initAudio();
  beep(660, 0.10, 'triangle', 0.045);
  setTimeout(() => beep(880, 0.12, 'triangle', 0.04), 90);
}

function gameOver(result){
  state = 'gameover';
  shake = 16;
  spawnDust(player.x + player.w/2, player.y + player.h/2, 28, '#d9534f', 1.4);
  spawnDust(player.x + player.w/2, player.y + player.h/2, 16, '#4a7bb5', 1.1);
  beep(180, 0.30, 'sawtooth', 0.07);
  setTimeout(() => beep(110, 0.45, 'sawtooth', 0.06), 110);

  hudEl.classList.add('hidden');

  const isClear = result === 'clear';
  const isEndless = currentLevel.id === 'endless';

  document.getElementById('overTitle').textContent = isClear ? '🎉 关卡通过' : '游戏结束';

  finalScEl.textContent = score;

  if(isEndless){
    const lb = getLB();
    const isNew = !lb.length || score > lb[0].score;
    finalTipEl.textContent = isNew ? '★ 新纪录 ★' : 'SCORE';
    finalTipEl.style.color = isNew ? '#b8860b' : '#6b7a8a';
    finalTipEl.style.letterSpacing = '0.35em';
  } else {
    const target = currentLevel.target;
    finalTipEl.textContent = isClear ? `已达成目标 ${target} 分` : `目标 ${target} 分 · 未达成`;
    finalTipEl.style.color = isClear ? '#2a5a8e' : '#d9534f';
    finalTipEl.style.letterSpacing = '0.05em';
  }

  /* 用户行 */
  if(currentUser){
    userLine.textContent = '👤 ' + currentUser.name;
    userLine.style.color = '#1a3c6e';
    userLine.classList.remove('hidden');
  } else {
    userLine.textContent = '未登录，成绩无法保存';
    userLine.style.color = '#d9534f';
    userLine.classList.remove('hidden');
  }

  /* 保存按钮 + 排行榜 */
  if(isEndless){
    if(currentUser){
      saveRow.classList.remove('hidden');
    } else {
      saveRow.classList.add('hidden');
    }
    document.getElementById('overBoard').style.display = 'block';
    renderLB(lbOverEl, 5, -1);
  } else {
    saveRow.classList.add('hidden');
    document.getElementById('overBoard').style.display = 'none';
    /* 关卡模式自动保存进度 */
    if(currentUser){
      setLevelResult(currentLevel.id, score, isClear);
    }
  }

  /* 下一关按钮 */
  const nextBtn = document.getElementById('btnNext');
  const idx = LEVEL_ORDER.indexOf(currentLevel.id);
  if(isClear && idx >= 0 && idx < LEVEL_ORDER.length - 1){
    nextBtn.style.display = 'inline-block';
    nextBtn.dataset.next = LEVEL_ORDER[idx + 1];
  } else {
    nextBtn.style.display = 'none';
  }

  setTimeout(() => {
    overEl.classList.remove('hidden');
  }, 420);
}

/* ---------- 渲染 ---------- */
function drawSky(){
  const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  g.addColorStop(0,    '#eef3fa');
  g.addColorStop(0.5,  '#dde7f3');
  g.addColorStop(1,    '#c8d6e8');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, GROUND_Y + 2);

  const sOff = scroll * 0.02;
  for(const c of clouds){
    const x = ((c.x - sOff * c.speed * 40) % (W + 300) + W + 300) % (W + 300) - 150;
    const r = 40 * c.scale;
    const gr = ctx.createRadialGradient(x, c.y, r * 0.2, x, c.y, r);
    gr.addColorStop(0, 'rgba(255,255,255,0.85)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gr;
    ctx.beginPath();
    ctx.arc(x, c.y, r, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawCityLayer(parallax, gap, baseH, range, color, seed){
  const sc = scroll * parallax;
  const off = ((sc % gap) + gap) % gap;
  const startIdx = Math.floor(sc / gap);
  const count = Math.ceil(W / gap) + 3;

  for(let i = -1; i < count; i++){
    const idx = startIdx + i;
    const x = i * gap - off;
    if(x > W + 10 || x + gap < -10) continue;

    const r1 = rand(idx * 1.7 + seed);
    const r2 = rand(idx * 3.9 + seed * 1.3);
    const h = baseH + r1 * range;
    const w = gap * 0.50 + r2 * gap * 0.42;

    ctx.fillStyle = color;
    rr(ctx, x, GROUND_Y - h, w, h, 6);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillRect(x + 4, GROUND_Y - h + 4, w - 8, 2);

    if(parallax > 0.25 && r1 > 0.35){
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      const cols = Math.max(1, Math.floor(w / 16));
      const rows = Math.max(1, Math.floor(h / 24));
      for(let cx = 0; cx < cols; cx++){
        for(let cy = 0; cy < rows; cy++){
          if(rand(idx * 7 + cx * 13 + cy * 29) > 0.5){
            ctx.fillRect(x + 8 + cx * 16, GROUND_Y - h + 14 + cy * 24, 6, 8);
          }
        }
      }
    }
  }
}

function drawGround(){
  const g = ctx.createLinearGradient(0, GROUND_Y, 0, H);
  g.addColorStop(0, '#d8e2ed');
  g.addColorStop(1, '#b8c4d4');
  ctx.fillStyle = g;
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);

  ctx.save();
  ctx.strokeStyle = 'rgba(26,60,110,0.08)';
  ctx.lineWidth = 1;
  const off = ((scroll * 1) % 110 + 110) % 110;
  for(let x = -220; x < W + 220; x += 110){
    const px = x - off;
    ctx.beginPath();
    ctx.moveTo(px, GROUND_Y);
    ctx.lineTo(px - 90, H);
    ctx.stroke();
  }
  for(let i = 1; i <= 3; i++){
    const y = GROUND_Y + i * 32;
    if(y > H) break;
    ctx.globalAlpha = 1 - i * 0.24;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  ctx.save();
  ctx.shadowColor = 'rgba(26,60,110,0.35)';
  ctx.shadowBlur = 12;
  ctx.strokeStyle = '#1a3c6e';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  ctx.lineTo(W, GROUND_Y);
  ctx.stroke();
  ctx.restore();

  ctx.save();
  const dashOff = (scroll * 1.2) % 90;
  ctx.fillStyle = 'rgba(26,60,110,0.22)';
  for(let x = -90; x < W + 90; x += 90){
    ctx.fillRect(x - dashOff, GROUND_Y + 16, 44, 3);
  }
  ctx.restore();
}

function drawObstacles(){
  for(const o of obstacles){
    ctx.save();
    ctx.shadowColor = 'rgba(217,83,79,0.4)';
    ctx.shadowBlur = 14;

    const g = ctx.createLinearGradient(o.x, o.y, o.x, o.y + o.h);
    g.addColorStop(0,   '#f08b86');
    g.addColorStop(0.5, '#d9534f');
    g.addColorStop(1,   '#a83a36');
    ctx.fillStyle = g;
    rr(ctx, o.x, o.y, o.w, o.h, 8);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    rr(ctx, o.x + 7, o.y + 7, Math.max(4, o.w - 14), 4, 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    rr(ctx, o.x + 7, o.y + o.h - 10, Math.max(4, o.w - 14), 5, 2);
    ctx.fill();
  }
}

function drawPlayer(){
  const cx = player.x + player.w / 2;
  const by = player.y + player.h;

  ctx.save();
  ctx.translate(cx, by);
  ctx.scale(player.sx, player.sy);
  ctx.translate(-player.w / 2, -player.h);

  const w = player.w, h = player.h;

  ctx.save();
  ctx.shadowColor = 'rgba(26,60,110,0.4)';
  ctx.shadowBlur = 18;

  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0,   '#4a7bb5');
  g.addColorStop(0.5, '#2a5a8e');
  g.addColorStop(1,   '#1a3c6e');
  ctx.fillStyle = g;
  rr(ctx, 0, 0, w, h, 11);
  ctx.fill();
  ctx.restore();

  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  rr(ctx, 5, 5, w - 10, 6, 3);
  ctx.fill();

  ctx.fillStyle = '#ffffff';
  const eyeY = h * 0.34;
  ctx.beginPath();
  ctx.arc(w * 0.32, eyeY, 3.5, 0, Math.PI * 2);
  ctx.arc(w * 0.70, eyeY, 3.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#0a1a2e';
  ctx.beginPath();
  ctx.arc(w * 0.33, eyeY, 1.6, 0, Math.PI * 2);
  ctx.arc(w * 0.71, eyeY, 1.6, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(w * 0.36, h * 0.62);
  ctx.lineTo(w * 0.64, h * 0.62);
  ctx.stroke();

  ctx.restore();

  if(player.onGround){
    ctx.save();
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = '#4a7bb5';
    ctx.beginPath();
    ctx.ellipse(cx, GROUND_Y + 3, 24, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawParticles(){
  for(const p of particles){
    const a = clamp(p.life / p.life0, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * (0.4 + a * 0.6), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawVignette(){
  const g = ctx.createRadialGradient(W/2, H/2, H*0.45, W/2, H/2, H*1.05);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(26,60,110,0.10)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function render(){
  let sx = 0, sy = 0;
  if(shake > 0){
    sx = (Math.random() - 0.5) * shake;
    sy = (Math.random() - 0.5) * shake;
  }
  ctx.setTransform(DPR, 0, 0, DPR, sx * DPR, sy * DPR);
  ctx.clearRect(-40, -40, W + 80, H + 80);

  drawSky();
  drawCityLayer(0.16, 100, 50, 110, '#d0dce8', 1.0);
  drawCityLayer(0.34, 130, 76, 170, '#bdcadb', 5.0);
  drawCityLayer(0.58, 170, 56, 120, '#a8b8ce', 9.0);

  drawGround();
  drawObstacles();
  if(player) drawPlayer();
  drawParticles();
  drawVignette();

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

/* ---------- 主循环 ---------- */
let lastTime = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if(dt > 0.05) dt = 0.05;
  if(dt < 0) dt = 0;

  update(dt);
  render();
}

/* ---------- 输入 ---------- */
function isTyping(e){
  return e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA');
}

window.addEventListener('keydown', e => {
  if(isTyping(e)) return;
  if(e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Enter'){
    e.preventDefault();
    if(state === 'playing') doJump();
  }
}, { passive: false });

cvs.addEventListener('pointerdown', e => {
  e.preventDefault();
  if(state === 'playing') doJump();
}, { passive: false });

cvs.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- 按钮绑定 ---------- */
document.getElementById('btnRestart').addEventListener('click', () => {
  overEl.classList.add('hidden');
  startGame(currentLevel.id);
});

document.getElementById('btnNext').addEventListener('click', () => {
  const next = document.getElementById('btnNext').dataset.next;
  if(next && LEVELS[next]){
    overEl.classList.add('hidden');
    startGame(next);
  }
});

document.getElementById('btnMenu').addEventListener('click', () => {
  overEl.classList.add('hidden');
  menuEl.classList.remove('hidden');
  state = 'menu';
  hudEl.classList.add('hidden');
  resetGame();
  renderLB(lbMenuEl, 5, -1);
  renderModeGrid();
});

document.getElementById('btnSave').addEventListener('click', () => {
  if(submitted) return;
  if(!currentUser) return;
  submitted = true;

  const name = currentUser.name || '无名跑者';

  const { rank } = addScore(name, score);
  renderLB(lbOverEl, 5, rank < 5 ? rank : -1);

  saveRow.classList.add('hidden');
  beep(880, 0.10, 'triangle', 0.05);
  setTimeout(() => beep(1180, 0.14, 'triangle', 0.045), 100);
});

/* ---------- 初始化 ---------- */
resetGame();
renderLB(lbMenuEl, 5, -1);
renderModeGrid();
fetchCurrentUser();
requestAnimationFrame(loop);
</script>
