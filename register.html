<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 梅陇中学论坛</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .auth-wrap {
            display: flex;
            max-width: 1000px;
            width: 100%;
            margin: 40px auto;
            background: rgba(255,255,255,0.55);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-radius: 28px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            border: 1px solid rgba(255,255,255,0.6);
            overflow: hidden;
        }
        .auth-left {
            flex: 0 0 320px;
            padding: 48px 36px;
            background: linear-gradient(135deg, rgba(26,60,110,0.08), rgba(124,108,255,0.06));
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-right: 1px solid rgba(0,0,0,0.04);
        }
        .auth-left h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1a3c6e, #2a5a8e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
        }
        .auth-left .sub {
            font-size: 0.9rem;
            color: #6b7a8a;
            line-height: 1.8;
            margin-bottom: 20px;
        }
        .auth-left .tip {
            background: rgba(255,255,255,0.5);
            border-left: 3px solid #1a3c6e;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #4a5a6a;
            line-height: 1.7;
        }
        .auth-left .tip strong { color: #1a3c6e; }
        .auth-right {
            flex: 1;
            padding: 40px 44px;
        }
        .auth-right h2 {
            font-size: 1.4rem;
            margin-bottom: 18px;
            color: #1a2332;
        }
        .form-row {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }
        .form-row > .form-group { flex: 1; min-width: 180px; }
        .auth-right .form-group { margin-bottom: 14px; }
        .auth-right .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #1a2332;
            font-size: 0.88rem;
        }
        .auth-right .form-group input,
        .auth-right .form-group select {
            width: 100%;
            padding: 9px 13px;
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 12px;
            background: rgba(255,255,255,0.6);
            font-family: inherit;
            font-size: 0.92rem;
            transition: 0.2s;
        }
        .auth-right .form-group input:focus,
        .auth-right .form-group select:focus {
            outline: none;
            border-color: #1a3c6e;
            background: rgba(255,255,255,0.9);
        }
        .form-hint {
            font-size: 0.78rem;
            color: #8b9aab;
            margin-top: 3px;
        }
        .auth-right .btn-primary {
            width: 100%;
            padding: 10px;
            border-radius: 30px;
            font-size: 1rem;
            margin-top: 8px;
        }
        .auth-right .links {
            margin-top: 16px;
            text-align: center;
            font-size: 0.9rem;
            color: #6b7a8a;
        }
        .auth-right .links a { color: #1a3c6e; }
        .auth-right .error,
        .auth-right .success {
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 14px;
            font-size: 0.9rem;
        }
        .auth-right .error { background: rgba(217,83,79,0.12); color: #d9534f; }
        .auth-right .success { background: rgba(92,184,92,0.12); color: #5cb85c; }
        @media (max-width: 768px) {
            .auth-wrap { flex-direction: column; margin: 16px; border-radius: 20px; }
            .auth-left { flex: none; padding: 28px 24px; border-right: none; border-bottom: 1px solid rgba(0,0,0,0.04); }
            .auth-left h1 { font-size: 1.4rem; }
            .auth-right { padding: 28px 24px; }
            .form-row { flex-direction: column; gap: 0; }
        }
    </style>
</head>
<body>
    <div class="auth-wrap">
        <!-- 左侧说明区 -->
        <div class="auth-left">
            <h1>📝 加入梅陇论坛</h1>
            <p class="sub">注册后即可发帖、回复、私信交流，参与论坛的每一次讨论。</p>
            <div class="tip">
                <strong>UID 格式说明</strong><br>
                <strong>ml</strong> 梅陇总校 / <strong>ms</strong> 梅陇实验<br>
                + 毕业年份 + 班级 + 学号<br>
                例如：<strong>ml20300323</strong>
            </div>
        </div>

        <!-- 右侧表单区 -->
        <div class="auth-right">
            <h2>📝 注册新账号</h2>
            <div id="error" class="error" style="display:none;"></div>
            <div id="success" class="success" style="display:none;"></div>

            <form id="registerForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>UID</label>
                        <input type="text" id="uid" placeholder="如 ml20300101" required>
                    </div>
                    <div class="form-group">
                        <label>姓名</label>
                        <input type="text" id="name" placeholder="真实姓名" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>性别</label>
                        <select id="gender" required>
                            <option value="">选择性别</option>
                            <option value="男">男</option>
                            <option value="女">女</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>年级</label>
                        <select id="grade" required>
                            <option value="">选择年级</option>
                            <option value="6">六年级</option>
                            <option value="7">七年级</option>
                            <option value="8">八年级</option>
                            <option value="9">九年级</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>班级</label>
                        <select id="class" required>
                            <option value="">选择班级</option>
                            <option value="1">1班</option><option value="2">2班</option>
                            <option value="3">3班</option><option value="4">4班</option>
                            <option value="5">5班</option><option value="6">6班</option>
                            <option value="7">7班</option><option value="8">8班</option>
                            <option value="9">9班</option><option value="10">10班</option>
                            <option value="11">11班</option><option value="12">12班</option>
                            <option value="13">13班</option><option value="14">14班</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="password" placeholder="至少8位，含大小写和数字" required>
                        <div class="form-hint">必须包含大小写字母和数字，长度 ≥ 8 位</div>
                    </div>
                    <div class="form-group">
                        <label>确认密码</label>
                        <input type="password" id="confirmPassword" placeholder="再次输入密码" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary">注册</button>
            </form>

            <div class="links">已有账号？<a href="/login.html">去登录</a></div>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const uid = document.getElementById('uid').value.trim();
            const name = document.getElementById('name').value.trim();
            const gender = document.getElementById('gender').value;
            const grade = document.getElementById('grade').value;
            const cls = document.getElementById('class').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            const errorEl = document.getElementById('error');
            const successEl = document.getElementById('success');
            errorEl.style.display = 'none';
            successEl.style.display = 'none';

            if (!uid || !name || !gender || !grade || !cls || !password || !confirmPassword) {
                errorEl.textContent = '请填写所有必填字段';
                errorEl.style.display = 'block';
                return;
            }
            if (password !== confirmPassword) {
                errorEl.textContent = '两次密码输入不一致';
                errorEl.style.display = 'block';
                return;
            }
            if (password.length < 8) {
                errorEl.textContent = '密码至少8位';
                errorEl.style.display = 'block';
                return;
            }
            if (!/(?=.*[a-z])(?=.*[A-Z])(?=.*\d)/.test(password)) {
                errorEl.textContent = '密码必须包含大小写字母和数字';
                errorEl.style.display = 'block';
                return;
            }

            const fd = new FormData();
            fd.append('uid', uid);
            fd.append('name', name);
            fd.append('gender', gender);
            fd.append('grade', grade);
            fd.append('class', cls);
            fd.append('password', password);
            fd.append('confirmPassword', confirmPassword);

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    credentials: 'include',
                    body: fd
                });
                const result = await res.json();
                if (result.success) {
                    successEl.textContent = '✅ 注册成功！即将跳转到登录页...';
                    successEl.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 2000);
                } else {
                    errorEl.textContent = result.error || '注册失败';
                    errorEl.style.display = 'block';
                }
            } catch (err) {
                errorEl.textContent = '网络错误，请重试';
                errorEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
