<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 梅陇中学论坛</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .form-hint {
            font-size: 0.85rem;
            color: #6b7a8a;
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <div class="container" style="max-width: 440px;">
        <div class="nav-links">
            <a href="/index.html">🏠 首页</a>
            <a href="/login.html">🔐 登录</a>
        </div>

        <h1 style="text-align:center; margin-bottom: 8px;">📝 注册新账号</h1>
        <p style="text-align:center; color:#6b7a8a; margin-bottom: 20px;">填写信息，成为梅陇论坛的一员</p>

        <div id="error" class="error" style="display:none;"></div>
        <div id="success" class="success" style="display:none;"></div>

        <form id="registerForm">
            <div class="form-group">
                <label>UID <span style="font-weight:400; color:#6b7a8a;">（格式：ml/ms + 年份 + 班级 + 学号）</span></label>
                <input type="text" id="uid" placeholder="如 ml20300101" required>
                <div class="form-hint">示例：<strong>ml</strong>（梅陇总校）或 <strong>ms</strong>（梅陇实验）+ <strong>2030</strong>（毕业年份）+ <strong>01</strong>（班级）+ <strong>01</strong>（学号）</div>
            </div>

            <div class="form-group">
                <label>姓名</label>
                <input type="text" id="name" placeholder="真实姓名" required>
            </div>

            <div class="form-group">
                <label>性别</label>
                <select id="gender" required>
                    <option value="">选择性别</option>
                    <option value="男">男</option>
                    <option value="女">女</option>
                </select>
            </div>

            <div class="form-group">
                <label>年级</label>
                <select id="grade" required>
                    <option value="">选择年级</option>
                    <option value="6">六年级</option>
                    <option value="7">七年级</option>
                    <option value="8">八年级</option>
                    <option value="9">九年级</option>
                </select>
            </div>

            <div class="form-group">
                <label>班级</label>
                <select id="class" required>
                    <option value="">选择班级</option>
                    <option value="1">1班</option><option value="2">2班</option>
                    <option value="3">3班</option><option value="4">4班</option>
                    <option value="5">5班</option><option value="6">6班</option>
                    <option value="7">7班</option><option value="8">8班</option>
                    <option value="9">9班</option><option value="10">10班</option>
                    <option value="11">11班</option><option value="12">12班</option>
                    <option value="13">13班</option>
                </select>
            </div>

            <div class="form-group">
                <label>手机号 <span style="font-weight:400; color:#6b7a8a;">（可选）</span></label>
                <input type="tel" id="phone" placeholder="如 13800138000">
            </div>

            <div class="form-group">
                <label>邮箱 <span style="font-weight:400; color:#6b7a8a;">（可选）</span></label>
                <input type="email" id="email" placeholder="如 example@mail.com">
            </div>
            <div class="form-hint" style="margin-bottom:12px;">※ 手机号和邮箱至少填写一个</div>

            <div class="form-group">
                <label>密码 <span style="font-weight:400; color:#6b7a8a;">（至少8位，含大小写字母和数字）</span></label>
                <input type="password" id="password" placeholder="如 Test123456" required>
                <div class="form-hint">必须包含大小写字母和数字，长度 ≥ 8 位</div>
            </div>

            <div class="form-group">
                <label>确认密码</label>
                <input type="password" id="confirmPassword" placeholder="再次输入密码" required>
            </div>

            <button type="submit" class="btn-primary" style="width:100%;">注册</button>
        </form>

        <p style="text-align:center; margin-top:16px;">已有账号？<a href="/login.html">去登录</a></p>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const uid = document.getElementById('uid').value.trim();
            const name = document.getElementById('name').value.trim();
            const gender = document.getElementById('gender').value;
            const grade = document.getElementById('grade').value;
            const cls = document.getElementById('class').value;
            const phone = document.getElementById('phone').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            const errorEl = document.getElementById('error');
            const successEl = document.getElementById('success');
            errorEl.style.display = 'none';
            successEl.style.display = 'none';

            // 前端校验
            if (!uid || !name || !gender || !grade || !cls || !password || !confirmPassword) {
                errorEl.textContent = '请填写所有必填字段';
                errorEl.style.display = 'block';
                return;
            }
            if (!phone && !email) {
                errorEl.textContent = '请至少填写手机号或邮箱';
                errorEl.style.display = 'block';
                return;
            }
            if (phone && !/^[\d\-+]{7,15}$/.test(phone)) {
                errorEl.textContent = '手机号格式不正确';
                errorEl.style.display = 'block';
                return;
            }
            if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                errorEl.textContent = '邮箱格式不正确';
                errorEl.style.display = 'block';
                return;
            }
            if (password !== confirmPassword) {
                errorEl.textContent = '两次密码输入不一致';
                errorEl.style.display = 'block';
                return;
            }
            if (password.length < 8) {
                errorEl.textContent = '密码至少8位';
                errorEl.style.display = 'block';
                return;
            }
            if (!/(?=.*[a-z])(?=.*[A-Z])(?=.*\d)/.test(password)) {
                errorEl.textContent = '密码必须包含大小写字母和数字';
                errorEl.style.display = 'block';
                return;
            }

            const fd = new FormData();
            fd.append('uid', uid);
            fd.append('name', name);
            fd.append('gender', gender);
            fd.append('grade', grade);
            fd.append('class', cls);
            fd.append('phone', phone);
            fd.append('email', email);
            fd.append('password', password);
            fd.append('confirmPassword', confirmPassword);

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    credentials: 'include',
                    body: fd
                });
                const result = await res.json();
                if (result.success) {
                    successEl.textContent = '✅ 注册成功！即将跳转到登录页...';
                    successEl.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 2000);
                } else {
                    errorEl.textContent = result.error || '注册失败';
                    errorEl.style.display = 'block';
                }
            } catch (err) {
                errorEl.textContent = '网络错误，请重试';
                errorEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
