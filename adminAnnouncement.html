<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公告管理</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .app-wrapper { max-width: 1400px; }
        .ann-item {
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(4px);
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 8px;
            border: 1px solid rgba(255,255,255,0.4);
        }
        .ann-title { font-weight: 600; }
        .ann-meta { font-size: 0.8rem; color: #6b7a8a; }
        .ann-actions button { margin-left: 6px; }
        .edit-btn, .delete-btn {
            border: none;
            padding: 2px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .edit-btn { background: rgba(26,60,110,0.1); color: #1a3c6e; }
        .edit-btn:hover { background: #1a3c6e; color: #fff; }
        .delete-btn { background: rgba(217,83,79,0.1); color: #d9534f; }
        .delete-btn:hover { background: #d9534f; color: #fff; }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .modal-content {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(20px);
            padding: 20px;
            border-radius: 20px;
            max-width: 450px;
            width: 90%;
        }
        .modal-content input, .modal-content textarea {
            width: 100%;
            margin: 4px 0;
            padding: 6px 10px;
            border-radius: 10px;
            border: 1px solid rgba(0,0,0,0.06);
            background: rgba(255,255,255,0.5);
        }
        .modal-actions { display: flex; gap: 8px; margin-top: 10px; }
        .modal-actions button { flex: 1; }
        .admin-menu a {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            margin: 0 8px;
            border-radius: 8px;
            color: #1a2332;
            text-decoration: none;
            gap: 8px;
        }
        .admin-menu a:hover { background: rgba(26,60,110,0.06); }
        .admin-menu a.active { background: rgba(26,60,110,0.1); color: #1a3c6e; font-weight:500; }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header"><h2>🔧 管理</h2></div>
            <nav class="sidebar-nav admin-menu">
                <a href="/adminDashboard.html">📊 仪表盘</a>
                <a href="/adminUsers.html">👥 用户管理</a>
                <a href="/adminPosts.html">📝 帖子管理</a>
                <a href="/adminCategories.html">📂 分类管理</a>
                <a href="/adminSensitive.html">🛡️ 敏感词</a>
                <a href="/adminAnnouncement.html" class="active">📢 公告</a>
                <a href="/adminMessages.html">📩 消息管理</a>
            </nav>
            <div style="padding:16px; margin-top:auto; border-top:1px solid rgba(0,0,0,0.04);">
                <button onclick="location.href='/adminLogin.html'" class="btn-secondary btn-sm" style="width:100%;">🚪 退出管理</button>
            </div>
        </aside>

        <main class="main-content">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; margin-bottom:12px;">
                <h1 class="page-title" style="margin-bottom:0;">📢 公告管理</h1>
                <button id="addBtn" class="btn-primary">➕ 新建公告</button>
            </div>
            <div id="annList">加载中...</div>
        </main>
    </div>

    <!-- 编辑/新建模态框 -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">新建公告</h3>
            <input type="hidden" id="editId">
            <input type="text" id="editTitle" placeholder="标题">
            <textarea id="editContent" rows="4" placeholder="内容"></textarea>
            <div style="display:flex; gap:12px; margin-top:6px; flex-wrap:wrap;">
                <label><input type="checkbox" id="editPinned"> 置顶</label>
                <label style="flex:1; display:flex; align-items:center; gap:6px;">
                    <span>过期时间：</span>
                    <input type="datetime-local" id="editExpires" style="flex:1; padding:4px 8px; border-radius:8px; border:1px solid rgba(0,0,0,0.06); background:rgba(255,255,255,0.5);">
                </label>
            </div>
            <div class="modal-actions">
                <button id="saveBtn" class="btn-primary">保存</button>
                <button onclick="closeModal()" class="btn-secondary">取消</button>
            </div>
        </div>
    </div>

    <script>
        let currentAnnouncements = [];

        async function loadAnnouncements() {
            try {
                const res = await fetch('/api/announcement', { credentials: 'include' });
                if (res.status === 401 || res.status === 403) {
                    window.location.href = '/adminLogin.html';
                    return;
                }
                const data = await res.json();
                currentAnnouncements = data.announcements || [];
                renderList();
            } catch (err) {
                document.getElementById('annList').innerHTML = '<div style="color:red;">加载失败</div>';
            }
        }

        function renderList() {
            const container = document.getElementById('annList');
            if (currentAnnouncements.length === 0) {
                container.innerHTML = '<div style="color:#999; text-align:center; padding:20px;">暂无公告</div>';
                return;
            }
            let html = '';
            currentAnnouncements.forEach(a => {
                const time = new Date(a.createdAt).toLocaleString('zh-CN');
                const expires = a.expiresAt ? new Date(a.expiresAt).toLocaleString('zh-CN') : '永不过期';
                html += `
                    <div class="ann-item">
                        <div class="ann-title">${a.isPinned ? '📌 ' : ''}${a.title}</div>
                        <div class="ann-meta">${time} · 过期: ${expires}</div>
                        <div style="margin:4px 0;">${a.content}</div>
                        <div class="ann-actions">
                            <button class="edit-btn" data-id="${a.id}">编辑</button>
                            <button class="delete-btn" data-id="${a.id}">删除</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;

            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = parseInt(this.dataset.id);
                    const ann = currentAnnouncements.find(a => a.id === id);
                    if (ann) openEditModal(ann);
                });
            });
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', async function() {
                    const id = parseInt(this.dataset.id);
                    if (!confirm('确定删除此公告？')) return;
                    try {
                        const res = await fetch(`/api/announcement?id=${id}`, { method: 'DELETE', credentials: 'include' });
                        const result = await res.json();
                        if (result.success) loadAnnouncements();
                        else alert('删除失败');
                    } catch (err) { alert('网络错误'); }
                });
            });
        }

        function openEditModal(ann = null) {
            document.getElementById('editId').value = ann ? ann.id : '';
            document.getElementById('editTitle').value = ann ? ann.title : '';
            document.getElementById('editContent').value = ann ? ann.content : '';
            document.getElementById('editPinned').checked = ann ? ann.isPinned : false;

            // 处理过期时间
            const expiresInput = document.getElementById('editExpires');
            if (ann && ann.expiresAt) {
                const date = new Date(ann.expiresAt);
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                const hours = String(date.getHours()).padStart(2, '0');
                const minutes = String(date.getMinutes()).padStart(2, '0');
                expiresInput.value = `${year}-${month}-${day}T${hours}:${minutes}`;
            } else {
                expiresInput.value = '';
            }

            document.getElementById('modalTitle').textContent = ann ? '编辑公告' : '新建公告';
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('editModal').style.display = 'none'; }
        document.getElementById('editModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        document.getElementById('addBtn').addEventListener('click', () => openEditModal());

        document.getElementById('saveBtn').addEventListener('click', async function() {
            const id = document.getElementById('editId').value;
            const title = document.getElementById('editTitle').value.trim();
            const content = document.getElementById('editContent').value.trim();
            const isPinned = document.getElementById('editPinned').checked;
            const expiresValue = document.getElementById('editExpires').value;
            let expiresAt = null;
            if (expiresValue) {
                expiresAt = new Date(expiresValue).getTime(); // 转为毫秒时间戳
            }

            if (!title || !content) { alert('标题和内容不能为空'); return; }

            const fd = new FormData();
            fd.append('title', title);
            fd.append('content', content);
            fd.append('isPinned', isPinned);
            if (expiresAt) fd.append('expiresAt', expiresAt);
            if (id) {
                fd.append('id', id);
                try {
                    const res = await fetch('/api/announcement', { method: 'PUT', credentials: 'include', body: fd });
                    const result = await res.json();
                    if (result.success) { alert('更新成功'); closeModal(); loadAnnouncements(); }
                    else alert(result.error);
                } catch (err) { alert('网络错误'); }
            } else {
                try {
                    const res = await fetch('/api/announcement', { method: 'POST', credentials: 'include', body: fd });
                    const result = await res.json();
                    if (result.success) { alert('创建成功'); closeModal(); loadAnnouncements(); }
                    else alert(result.error);
                } catch (err) { alert('网络错误'); }
            }
        });

        loadAnnouncements();
    </script>
</body>
</html>
